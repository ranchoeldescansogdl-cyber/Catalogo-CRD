<style>
/* 10 oct 2026: reportes de turno, movimientos, caballos y calendario de redes */
.t-chips{display:flex;flex-wrap:wrap;gap:6px}.t-chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.85rem;font-weight:600;border:1px solid var(--rule);background:#fff}
.t-ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.t-falta{background:var(--bad-bg);color:var(--bad);border-color:transparent}.t-pend{background:var(--warn-bg);color:var(--warn);border-color:transparent}.t-futuro{color:var(--muted)}
.t-tabla td{vertical-align:middle}.card.t-prob{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}
.qa-turno{width:100%;margin-top:12px}
.ca-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin:0 0 6px;cursor:pointer}
.ca-row span:not(.badge){grid-column:1;color:var(--muted);font-size:.88rem}.ca-row .badge{grid-column:2;grid-row:1/span 2;align-self:center}
.rc-bar{display:flex;align-items:center;gap:10px;margin:6px 0 10px}.rc-bar b{font-family:var(--display);font-size:1.2rem;min-width:170px;text-align:center}
.rc-sem,.rc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.rc-sem span{text-align:center;font-size:.78rem;color:var(--muted);font-weight:600}
.rc-d{min-height:86px;background:#fff;border:1px solid var(--rule);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;cursor:pointer;text-align:left;overflow:hidden}
.rc-vacio{background:transparent;border:0;cursor:default}.rc-hoy{border-color:var(--gold)}.rc-sel{outline:2px solid var(--gold-deep);outline-offset:-1px}
.rc-n{font-size:.78rem;font-weight:600;color:var(--muted)}.rc-p{position:relative;display:block;border-radius:6px;overflow:hidden;background:var(--info-bg);height:34px;border-left:4px solid #bbb}
.rc-p img{width:100%;height:100%;object-fit:cover;display:block}.rc-p i{position:absolute;left:3px;bottom:1px;font-style:normal;font-size:.68rem;font-weight:700;color:#fff;text-shadow:0 0 3px #000}
.rc-mas{font-size:.72rem;color:var(--muted)}.rc-por-aprobar,.rc-pedir-cambios{border-left-color:#d08a00}.rc-agendado,.rc-aprobado{border-left-color:var(--gold-deep)}.rc-publicado{border-left-color:var(--ok)}.rc-borrador,.rc-pedido,.rc-error{border-left-color:#999}
.rc-ley{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}.rc-k{display:inline-block;width:12px;height:12px;border-radius:3px;border-left:6px solid;margin-right:4px;vertical-align:-1px}
.rc-k.rc-por-aprobar{border-color:#d08a00}.rc-k.rc-agendado{border-color:var(--gold-deep)}.rc-k.rc-publicado{border-color:var(--ok)}.rc-k.rc-borrador{border-color:#999}
.r-ins{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:0 0 6px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}.r-ins p{margin:0}.r-ins .card-m{grid-column:1}.r-ins button{grid-column:2;grid-row:1/span 2}
.r-graf{width:100%;max-width:240px;height:48px;display:block;margin:6px 0 2px}.r-vp{max-width:240px;border-radius:12px;display:block;margin:10px 0 0}
@media (max-width:600px){.rc-d{min-height:64px;padding:3px}.rc-p{height:26px}.rc-p i{font-size:.6rem}}
/* 11 oct 2026: calendario de redes dinámico (panel por día, editar ahí mismo, arrastrar para mover) */
.rc-d:hover{border-color:var(--gold)}.rc-d.rc-drop{background:#fffaf0;border:2px dashed var(--gold-deep)}.rc-d.rc-pasado{background:#faf9f6}
.rc-p[draggable=true]{cursor:grab}.rc-p.rc-arr{opacity:.4}.rc-p b{position:absolute;right:3px;top:1px;font-size:.62rem;color:#fff;text-shadow:0 0 3px #000;font-weight:600}
.rc-tip{font-size:.8rem;color:var(--muted);margin:6px 0 0}
#rcp{max-width:560px;width:100%;margin:0 0 0 auto;height:100dvh;max-height:100dvh;border-radius:16px 0 0 16px;display:none;flex-direction:column;background:var(--mist)}
#rcp[open]{display:flex}
.rcp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--black);color:#fff}.rcp-h b{flex:1;font-family:var(--display);font-size:1.15rem;text-align:center}
.rcp-h .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.rcp-b{flex:1;overflow:auto;padding:14px;text-align:left}
.rcv{background:#fff;border:1px solid var(--rule);border-radius:14px;margin:0 0 14px;overflow:hidden;scroll-margin-top:10px}.rcv.rcv-foco{outline:2px solid var(--gold);outline-offset:-2px}
.rcv-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}.rcv-h .t{flex:1;min-width:0}.rcv-h .t b{display:block}.rcv-h .t span{font-size:.85rem;color:var(--muted)}
.rcv-hora{font-family:var(--display);font-size:1.25rem;min-width:52px}
.rcv-media{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 12px 0}.rcv-media>*{flex:0 0 auto;scroll-snap-align:start}
.rcv-media img,.rcv-media video{height:190px;width:auto;max-width:280px;object-fit:cover;border-radius:10px;display:block;background:var(--info-bg)}.rcv-media video{object-fit:contain;background:#000}
.r-vps{display:flex;gap:6px;overflow-x:auto;margin:10px 0 0}.r-vps>*{flex:0 0 auto}.r-vps video.r-vp{max-width:240px;max-height:320px;background:#000;margin:0}.r-vps .r-vp{margin:0;max-height:320px}
.rcv-media button{padding:0;border:0;background:none;cursor:zoom-in;position:relative}.rcv-media .r-play{position:absolute;left:6px;bottom:6px}
.rcv-txt{white-space:pre-wrap;padding:10px 12px 0;margin:0;font-size:.95rem}.rcv-txt .h{color:var(--gold-deep)}
.rcv-meta{padding:6px 12px 0;font-size:.82rem;color:var(--muted)}
.rcv .acts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px}.rcv .acts .btn{font-size:.9rem;padding:6px 12px}
.rcv-frm{padding:0 12px 12px;display:none}.rcv-frm.on{display:block}.rcv-frm label{display:block;font-size:.85rem;font-weight:600;margin:8px 0 4px}
.rcv-frm textarea,.rcv-frm input{width:100%;border:1px solid var(--rule);border-radius:10px;padding:9px 10px}.rcv-frm .dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rcv-frm .nota{font-size:.82rem;color:var(--muted);margin:6px 0}.rcv-frm .fila{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rcv details{padding:0 12px 8px}.rcv details summary{cursor:pointer;font-size:.85rem;color:var(--gold-deep)}.rcv details pre{white-space:pre-wrap;font:inherit;font-size:.85rem;margin:6px 0 0}
.rcp-vacio{text-align:center;color:var(--muted);padding:30px 10px}
@media (max-width:700px){#rcp{max-width:100%;height:92dvh;max-height:92dvh;margin:auto 0 0;border-radius:16px 16px 0 0}.rcv-media img,.rcv-media video{height:160px}}
/* Portal del equipo (1 oct 2026). Datos: /api/equipo (cada rol recibe solo lo suyo). */
:root{
  --black:#000; --ink:#0A0A0A; --paper:#fff; --mist:#F4F3F0; --muted:#5E5B55; --rule:rgba(0,0,0,.12);
  --gold:#CEB35C; --gold-deep:#A3853C; --gold-light:#E0C068;
  --ok:#1f7a3d; --ok-bg:#e6f3ea; --warn:#8a5a00; --warn-bg:#fdf1d6; --bad:#b3261e; --bad-bg:#fbe6e4; --info-bg:#eceae4;
  --display:'Marcellus',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
.ev-mini{background:#fff;border:1px solid var(--rule);border-radius:12px;margin:0 0 8px}.ev-mini>summary{padding:12px 14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.ev-mini>summary>span{flex:1;min-width:0}.ev-mini>summary::-webkit-details-marker{display:none}
.ev-mini>summary::after{content:"Ver ▾";flex:none;color:var(--gold-deep);font-size:.85rem}.ev-mini[open]>summary::after{content:"Ocultar ▴"}.ev-mini .card{border:0;margin:0;box-shadow:none}
.qa.qa-ya{border-color:var(--gold);background:#fffaf0}.qa small{display:block;color:var(--muted);font-size:.8rem}
.es-tabla{border:1px solid var(--rule);border-radius:12px;background:#fff;overflow:hidden;text-align:left}
.es-r{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--rule)}.es-r:last-child{border-bottom:0}
.es-r small{display:block;color:var(--muted);font-size:.85rem}.es-r .n{white-space:nowrap;font-variant-numeric:tabular-nums}
.es-r.ant{background:var(--mist)}.es-r.pago .n{color:var(--ok)}.es-tot{background:var(--ink);color:#fff}.es-tot .n{font-weight:600}
.es-acc{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.es-acc .btn{padding:4px 10px;font-size:.85rem}

/* barra superior */
.top{position:sticky;top:0;z-index:5;background:var(--black);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.top-row{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto}
.top-row img{height:28px;width:auto}
.top-row h1{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:.85rem;color:rgba(255,255,255,.75);text-align:right;line-height:1.2}
.who b{display:block;color:#fff;font-weight:500}
.btn-out{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
#b-regl{border-color:transparent;color:rgba(255,255,255,.7);padding:6px 8px}#b-regl:hover{color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1200px;margin:10px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.7);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;font-weight:500}
.tab[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}

main{max-width:1200px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:8px 0 12px}
h3{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:22px 0 10px}
.sub{color:var(--muted);margin:-6px 0 14px;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--black);color:var(--gold);border-color:var(--black)}
.search{flex:1;min-width:180px;border:1px solid var(--rule);border-radius:999px;padding:8px 14px;background:#fff}

/* tarjetas y tablas */
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.kpi{background:#fff;border-radius:12px;padding:14px;border:1px solid var(--rule)}
.kpi span{display:block;color:var(--muted);font-size:.82rem}
.kpi b{font-family:var(--display);font-weight:400;font-size:1.5rem}
.day{margin:0 0 18px}
.day-h{font-weight:600;font-size:.9rem;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.day-h small{font-weight:400}
.card{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px;margin:0 0 8px}
.card-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card-t{font-weight:600;margin:0}
.card-m{color:var(--muted);font-size:.92rem;margin:2px 0 0}
.time{font-family:var(--display);font-size:1.3rem;min-width:62px;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0 0;font-size:.93rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;border:1px solid var(--rule);background:#fff;cursor:pointer;text-decoration:none;font-size:.9rem;font-weight:500}
.btn-dark{background:var(--black);color:var(--gold);border-color:var(--black)}
.btn-wa{background:#25D366;color:#fff;border-color:#25D366}
.btn[disabled]{opacity:.5;cursor:default}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--muted)}
.regl{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:6px 18px 14px;max-width:860px}
.regl h2{font-size:1.35rem;margin:14px 0 4px}.regl h3{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:22px 0 6px;color:var(--gold-deep)}
.regl p,.regl li{max-width:70ch}.regl ul,.regl ol{padding-left:22px;margin:6px 0 10px}.regl li{margin:3px 0}.regl .tbl-wrap{margin:8px 0 12px}
.regl-ok{position:sticky;bottom:0;max-width:860px;background:var(--mist);border-top:1px solid var(--rule);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.regl-ok label{display:flex;gap:8px;align-items:flex-start;font-weight:500}.regl-ok input{width:22px;height:22px;margin-top:2px;accent-color:var(--black)}
.regl-ok .btn{padding:12px 22px;font-size:1rem}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;background:#faf9f6;position:sticky;top:0}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.empty{background:#fff;border:1px dashed var(--rule);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:14px;margin:0 0 12px}
.load{color:var(--muted);padding:24px 0}
details.more summary{cursor:pointer;color:var(--gold-deep);font-size:.9rem;margin-top:8px}
details.more pre{white-space:pre-wrap;font-family:inherit;font-size:.88rem;color:var(--muted);margin:6px 0 0}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;background:var(--black);padding:24px}
.login-box{width:100%;max-width:380px;text-align:center;color:#fff}
.login-box img{width:200px;max-width:70%;height:auto;margin:0 auto 18px;display:block}
.login-box h1{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.6rem;margin:0 0 6px}
.login-box p{color:rgba(255,255,255,.7);margin:0 0 20px}
.login-box input{width:100%;padding:13px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:#111;color:#fff;margin:0 0 10px}
.login-box .btn-dark{width:100%;justify-content:center;background:var(--gold);color:#000;border-color:var(--gold);padding:13px}
.login-msg{min-height:1.5em;margin:12px 0 0;color:var(--gold-light);font-size:.95rem}
.sep{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.4);margin:18px 0;font-size:.85rem}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.15)}
#g-btn{display:flex;justify-content:center}

/* visor de identificación */
dialog{border:0;border-radius:14px;padding:0;max-width:min(720px,96vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.75)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.dlg-b{padding:16px;max-height:80dvh;overflow:auto;text-align:center}
.dlg-b img{max-width:100%;height:auto}
.dlg-b iframe{width:100%;height:70dvh;border:0}
.dlg-b textarea,.dlg-b input{width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px;margin:0 0 10px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--black);color:var(--gold);padding:10px 18px;border-radius:999px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.frm{text-align:left}
.frm label{display:block;font-size:.88rem;color:var(--muted);margin:0 0 4px}
.frm input,.frm select,.frm textarea{width:100%;border:1px solid var(--rule);border-radius:10px;padding:11px 12px;margin:0 0 12px;background:#fff;font-size:1rem}
.frm .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .frm .tres label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frm .btn-dark{width:100%;justify-content:center;padding:13px;font-size:1rem}
.fotos-prev{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.fotos-prev img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--rule)}
.foto-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--gold-deep);border-radius:12px;padding:14px;margin:0 0 12px;color:var(--gold-deep);font-weight:600;cursor:pointer;background:#fffdf6}
.foto-btn input{display:none}
.big-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.big-actions .btn{padding:12px 18px;font-size:1rem}
.t-vencida{color:var(--bad);font-weight:600}
.prio-Alta{border-left:4px solid var(--bad)} .prio-Normal{border-left:4px solid var(--gold)} .prio-Baja{border-left:4px solid var(--rule)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.galeria img{width:100%;border-radius:10px}
.mes{border:1px solid var(--rule);border-radius:999px;padding:7px 14px;background:#fff}
details.prov{background:#fff;border:1px solid var(--rule);border-radius:12px;margin:0 0 8px;padding:12px 14px}
details.prov summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
details.prov summary::-webkit-details-marker{display:none}
/* navegación (3 oct 2026): en celular, menú de cuadros grandes y cada sección en su página con "← Menú";
   en computadora, lista vertical fija a la izquierda */
.backbar{display:none}
.menu-hola{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:6px 0 2px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 0}
.menu-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:120px;padding:18px 10px;background:#fff;border:1px solid var(--rule);border-radius:16px;cursor:pointer;font-weight:600;font-size:1.05rem;line-height:1.2;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.menu-tile .ico{font-size:2.1rem;line-height:1}
.menu-tile:active{transform:scale(.98);background:#faf8f2}
.menu-tile .n{position:absolute;top:10px;right:10px;background:var(--gold);color:#000;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 7px;font-size:.85rem;font-weight:700}
.tab .ico{display:none}
@media (max-width:899px){
  .tabs{display:none}

/* formulario de tarea: nueva (asignar), pedir (le llega a Mario y Nico) o aprobar una solicitud */
function formTarea(modo, t) {
  const O = YO.org || {}, per = (TAREAS && TAREAS.personas) || [], areas = O.areas && O.areas.length && modo === "nueva" ? O.areas : AREAS;
  const area0 = t ? t["Área"] : areas.includes(O.area) ? O.area : areas[0];
  const opcPer = per.map(x => `<option value="${esc(x.nombre)}">${esc(x.nombre)}${x.area ? " · " + esc(x.area) : ""}</option>`).join("");
  const destino = `<label>¿Para quién?</label><select id="d-a"><option value="">Elige a una persona</option>${opcPer}${per.length > 1 ? `<option value="__disp">Disponible: que la tome alguien que yo elija</option>` : ""}</select>
    <div id="d-disp" hidden><label>¿Quién puede tomarla? El primero que la tome se la queda.</label><div class="chkgrid">
      ${(YO.org && O.revisaTodo) || (TAREAS && TAREAS.personas.length >= ((TAREAS.todos || []).length)) ? `<label class="chk"><input type="checkbox" id="d-todos"> Todos</label>` : ""}
      ${per.map(x => `<label class="chk"><input type="checkbox" data-dp="${esc(x.corto)}"> ${esc(x.corto)}</label>`).join("")}</div></div>`;
  const foto = `<label class="chk"><input type="checkbox" id="d-foto"${t && t._foto ? " checked" : ""}> 📷 Pide foto al terminar (no se puede marcar como hecha sin foto)</label>`;

    ${pedir ? `<label>¿Quién crees que debería hacerla? (opcional)</label><select id="d-a"><option value="">Que lo decida Mario</option>${todos.filter(n => n !== YO.usuario.nombre).map(n => `<option>${esc(n)}</option>`).join("")}</select>` : destino}
    <div class="dos"><div><label>Área</label><select id="d-ar">${opt(areas, area0)}</select></div><div><label>Para cuándo</label><input id="d-l" type="date" min="${hoyD()}"></div></div>
    <label>Prioridad</label><select id="d-p">${opt(["Normal", "Alta", "Baja"], "Normal")}</select>

const rFechaDe = p => String(p["Fecha y hora"] || "");

function rPubsCal() { return REDES.publicaciones.filter(p => rDe(p) && p["Estatus"] !== "Descartado" && /^\d{4}-\d{2}-\d{2}/.test(rFechaDe(p))); }
function rCalendario() {

  const primero = mes + "-01", dias = new Date(Date.UTC(y, mm, 0)).getUTCDate(), off = diaSemana(primero) - 1;
  const nav = d => { const t = new Date(Date.UTC(y, mm - 1 + d, 1)); return t.toISOString().slice(0, 7); };
  const nombreMes = new Date(Date.UTC(y, mm - 1, 15)).toLocaleDateString("es-MX", {month: "long", year: "numeric", timeZone: "UTC"});
  let celdas = ""; for (let i = 0; i < off; i++) celdas += `<div class="rc-d rc-vacio"></div>`;

    const ap = L.filter(p => p["Estatus"] === "Por aprobar").length;

      return `<span class="rc-p rc-${esc(String(p["Estatus"]).replace(/\s+/g, "-").toLowerCase())}" data-rc-pub="${esc(p.ID)}"${rMovible(p) ? ` draggable="true" title="Arrastra a otro día para moverla"` : ""}>${t ? `<img src="${esc(t)}" alt="" loading="lazy" draggable="false" onerror="this.remove()">` : ""}<i>${esc(rFechaDe(p).slice(11, 16))}</i>${/historia/i.test(p["Formato"] || "") ? "<b>H</b>" : ""}</span>`; }).join("")}${L.length > 3 ? `<span class="rc-mas">+${L.length - 3}</span>` : ""}</div>`;
  }

  return `<div class="rc-bar"><button class="btn" type="button" data-r-mes="${nav(-1)}" aria-label="Mes anterior">‹</button><b>${esc(nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1))}</b><button class="btn" type="button" data-r-mes="${nav(1)}" aria-label="Mes siguiente">›</button>${mes !== hoy.slice(0, 7) ? `<button class="chip" type="button" data-r-mes="${hoy.slice(0, 7)}">Hoy</button>` : ""}</div>
    <div class="rc-sem">${["L", "M", "M", "J", "V", "S", "D"].map(x => `<span>${x}</span>`).join("")}</div><div class="rc-grid">${celdas}</div>
    <p class="card-m rc-ley"><span class="rc-k rc-por-aprobar"></span>Por aprobar <span class="rc-k rc-agendado"></span>Agendada <span class="rc-k rc-publicado"></span>Publicada <span class="rc-k rc-borrador"></span>En preparación · H = historia</p>

}

      ${VEHS.papeles ? `<button class="btn" data-veh-seg="${esc(id)}">Seguro</button>${r && r["¿Aplica?"] === "Sí" ? `<button class="btn" data-veh-ref="${esc(id)}">Refrendo</button>` : ""}${r && r["¿Aplica? 2"] === "Sí" ? `<button class="btn" data-veh-ver="${esc(id)}">Verificación</button>` : ""}` : ""}</div></article>`;
  };
  return `<h2>Vehículos</h2><p class="sub">Control vehicular MCM · ${VEHS.todas ? "todas las unidades" : "unidades del rancho y la carpintería"}. Lo que captures aquí se escribe en el archivo de Drive.</p>
    <div class="kpis"><div class="kpi"><span>Unidades</span><b>${V.length}</b></div><div class="kpi"><span>Vencidos</span><b>${venc}</b></div><div class="kpi"><span>Por vencer</span><b>${pend.length - venc}</b></div></div>
    ${pend.length ? `<h3>Pendientes</h3>${pend.map(p => `<article class="card"><div class="card-h"><div style="flex:1;min-width:0"><p class="card-t">${esc(p.concepto)} · ${esc(vehNom(p.v))}</p><p class="card-m">${esc(p.detalle || "")}${p.v["Usuario / Resguardo"] ? " · " + esc(p.v["Usuario / Resguardo"]) : ""}</p></div>${vehBadge(p.estado)}</div></article>`).join("")}` : `<p class="card-m">Nada vencido ni por vencer.</p>`}
    <h3>Unidades</h3>${VEHS.todas && areas.length > 1 ? `<div class="sv-chips">${["todas", ...areas].map(a => `<button type="button" class="chip" data-veh-area="${esc(a)}" aria-pressed="${a === f}">${esc(a === "todas" ? "Todas" : a)}</button>`).join("")}</div>` : ""}
    ${lista.map(card).join("") || `<p class="card-m">No hay unidades.</p>`}`;
}
async function vehCamposCaja() { // campos extra del gasto de caja chica "Servicios de vehículos"
  try { await cargar("vehiculos"); } catch (e) { return `<div class="err">${esc(e.message)}</div>`; }
  return `<label>¿De qué vehículo?</label><select id="cc-v"><option value="">Elige…</option>${vehActivos().map(v => `<option value="${esc(v["ID"])}">${esc(vehNom(v))}${v["Placas"] ? " · " + esc(v["Placas"]) : ""}</option>`).join("")}</select>
    <div class="dos"><div><label>¿Qué fue?</label><select id="cc-vt">${opt(["Servicio", "Reparación", "Llantas", "Otro"], "Servicio")}</select></div><div><label>Km u horas (si lo sabes)</label><input id="cc-vl" type="number" inputmode="decimal" min="0"></div></div>
    <label>Taller o proveedor</label><input id="cc-vtl" maxlength="80">
    <div class="dos"><div><label>Próximo servicio a los (km/hrs)</label><input id="cc-vpl" type="number" inputmode="numeric" min="0"></div><div><label>o en la fecha</label><input id="cc-vpf" type="date"></div></div>
    <p class="card-m" style="margin-top:-6px">Se anota también en la bitácora del vehículo; no hay que capturarlo dos veces.</p>`;
}
async function vehEnviar(box, body, ok) {
  const b = box.querySelector("#d-ok"); b.disabled = true; b.textContent = "Guardando…";
  try {
    const archivos = await archivosDe(box);
    try { await post({accion: "hacer", ...body, archivos}); }
    catch (e) { if (!/última lectura/i.test(e.message) || !confirm(e.message + "\n\n¿La guardo así de todos modos?")) throw e; body.reg.forzar = true; await post({accion: "hacer", ...body, archivos}); }
    $("#dlg").close(); toast(ok); VEHS = null; render();
  } catch (e) { alert(e.message); b.disabled = false; b.textContent = "Intentar de nuevo"; }
}
function dialogoVehBitacora(id, modo) {
  const v = VEHS.vehiculos.find(x => x["ID"] === id); if (!v) return;
  const m = vehM(id), u = m["Unidad"], conLect = u === "Km" || u === "Hrs", lbl = u === "Hrs" ? "Horas (horómetro)" : "Kilometraje";
  const ult = m["Última lectura (auto)"] ? `<p class="ctx">Última lectura: ${esc(m["Última lectura (auto)"])} ${esc(u || "")}${m["Fecha de lectura (auto)"] ? " el " + esc(m["Fecha de lectura (auto)"]) : ""}.</p>` : "";
  const box = modo === "lectura" ? dialogo("Anotar " + (u === "Hrs" ? "horas" : "kilometraje") + " · " + vehNom(v), `<div class="frm">${ult}
      <div class="dos"><div><label>${lbl}</label><input id="vb-l" type="number" inputmode="decimal" min="0" step="0.1"></div><div><label>Fecha</label><input id="vb-f" type="date" value="${hoyISO()}" max="${hoyISO()}"></div></div>
      <label>Nota (opcional)</label><input id="vb-n" maxlength="250" placeholder="Ej. Se oye un ruido al frenar">
      ${campoFotos("Foto del tablero u horómetro (opcional)")}
      <button class="btn btn-dark" id="d-ok" type="button">Guardar</button></div>`)
    : dialogo("Servicio o reparación · " + vehNom(v), `<div class="frm">${ult}
      <label>¿Qué fue?</label><div class="sv-chips">${["Servicio", "Reparación", "Llantas", "Otro"].map((t, i) => `<button type="button" class="chip" data-vb-t="${t}" aria-pressed="${i === 0}">${t}</button>`).join("")}</div>
      <div class="dos"><div><label>Fecha</label><input id="vb-f" type="date" value="${hoyISO()}" max="${hoyISO()}"></div>${conLect ? `<div><label>${lbl} (si lo sabes)</label><input id="vb-l" type="number" inputmode="decimal" min="0" step="0.1"></div>` : ""}</div>
      <label>¿Qué se hizo?</label><input id="vb-d" maxlength="200" placeholder="Ej. Cambio de aceite y filtros">
      <div class="dos"><div><label>Taller o proveedor</label><input id="vb-tl" maxlength="80"></div><div><label>Costo</label><input id="vb-c" type="number" inputmode="decimal" min="0" step="0.01" placeholder="$"></div></div>
      ${VEHS.papeles ? "" : `<p class="card-m" style="margin-top:-6px">Si lo pagaste con la caja chica, mejor regístralo en Caja chica → Registrar un gasto → "Servicios de vehículos": se anota aquí solo.</p>`}
      ${`<div class="dos"><div><label>Próximo servicio a los${u ? " (" + esc(u) + ")" : ""}</label><input id="vb-pl" type="number" inputmode="numeric" min="0"></div><div><label>o en la fecha</label><input id="vb-pf" type="date"></div></div>`}
      <label>Nota (opcional)</label><input id="vb-n" maxlength="250">
      ${campoFotos("Foto de la factura o del trabajo (opcional)", true)}
      <button class="btn btn-dark" id="d-ok" type="button">Guardar</button></div>`);
  activarFotos(box);
  box.querySelectorAll("[data-vb-t]").forEach(x => x.addEventListener("click", () => box.querySelectorAll("[data-vb-t]").forEach(y => y.setAttribute("aria-pressed", y === x))));
  box.querySelector("#d-ok").onclick = () => {
    const g = s => ((box.querySelector(s) || {}).value || "").trim();
    if (modo === "lectura") { if (!(Number(g("#vb-l")) > 0)) return alert("Escribe el " + (u === "Hrs" ? "número de horas." : "kilometraje."));
      return vehEnviar(box, {tipo: "vehiculo", op: "bitacora", id, reg: {tipo: "Lectura", lectura: g("#vb-l"), fecha: g("#vb-f"), notas: g("#vb-n")}}, "Lectura guardada en el control vehicular"); }
    const t = (box.querySelector("[data-vb-t][aria-pressed=true]") || {}).dataset?.vbT || "Servicio";
    if (g("#vb-d").length < 3) return alert("Escribe qué se hizo.");
    vehEnviar(box, {tipo: "vehiculo", op: "bitacora", id, reg: {tipo: t, lectura: g("#vb-l"), fecha: g("#vb-f"), descripcion: g("#vb-d"), taller: g("#vb-tl"), costo: g("#vb-c"), notas: g("#vb-n")},
      proximo: {lectura: g("#vb-pl"), fecha: g("#vb-pf")}}, "Guardado en la bitácora del vehículo");
  };
}
const vehISO = s => { const m = String(s || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : ""; };
function dialogoVehSeguro(id) {
  const v = VEHS.vehiculos.find(x => x["ID"] === id), s = vehS(id) || {}, n = x => String(s[x] || "").replace(/[^0-9.]/g, "");
  const box = dialogo("Seguro · " + vehNom(v), `<div class="frm"><p class="ctx">${s["Aseguradora"] ? "Póliza actual: " + esc(s["Aseguradora"]) + " " + esc(s["No. de Póliza"] || "") + (s["Fin vigencia"] ? ", vence " + esc(s["Fin vigencia"]) : "") + ". Al renovar, escribe los datos de la póliza nueva." : "Esta unidad no tiene seguro registrado."}</p>
    <div class="dos"><div><label>Aseguradora</label><input id="vs-a" maxlength="60" value="${esc(s["Aseguradora"] || "")}"></div><div><label>No. de póliza</label><input id="vs-p" maxlength="60" value="${esc(s["No. de Póliza"] || "")}"></div></div>
    <div class="dos"><div><label>A nombre de</label><input id="vs-n" maxlength="60" value="${esc(s["Asegurado a nombre de"] || "")}"></div><div><label>Plan / cobertura</label><input id="vs-pl" maxlength="60" value="${esc(s["Plan / Cobertura"] || "")}"></div></div>
    <div class="dos"><div><label>Inicio de vigencia</label><input id="vs-i" type="date" value="${vehISO(s["Inicio vigencia"])}"></div><div><label>Fin de vigencia</label><input id="vs-f" type="date" value="${vehISO(s["Fin vigencia"])}"></div></div>
    <div class="dos"><div><label>Forma de pago</label><select id="vs-fp">${opt(["Anual", "Semestral", "Trimestral", "Mensual"], s["Forma de pago"] || "Anual")}</select></div><div><label>Fecha de pago</label><input id="vs-fpg" type="date"></div></div>
    <div class="dos"><div><label>Prima neta</label><input id="vs-pr" type="number" inputmode="decimal" value="${n("Prima neta")}"></div><div><label>Pago total</label><input id="vs-t" type="number" inputmode="decimal" value="${n("Pago total")}"></div></div>
    <label>Nota (opcional)</label><input id="vs-no" maxlength="300">
    ${campoFotos("Póliza o recibo (opcional)", true)}
    <button class="btn btn-dark" id="d-ok" type="button">Guardar</button></div>`);
  activarFotos(box);
  box.querySelector("#d-ok").onclick = () => { const g = q => ((box.querySelector(q) || {}).value || "").trim();
    if (!g("#vs-a") || !g("#vs-f")) return alert("Escribe la aseguradora y el fin de vigencia.");
    vehEnviar(box, {tipo: "vehiculo", op: "seguro", id, seguro: {aseguradora: g("#vs-a"), poliza: g("#vs-p"), asegurado: g("#vs-n"), plan: g("#vs-pl"), inicio: g("#vs-i"), fin: g("#vs-f"), forma: g("#vs-fp"), fechaPago: g("#vs-fpg"), prima: g("#vs-pr"), total: g("#vs-t"), notas: g("#vs-no")}}, "Seguro actualizado"); };
}
function dialogoVehPapel(id, op) {
  const v = VEHS.vehiculos.find(x => x["ID"] === id), r = vehR(id) || {}, ref = op === "refrendo";
  const box = dialogo((ref ? "Refrendo · " : "Verificación · ") + vehNom(v), `<div class="frm">
    <p class="ctx">${ref ? "Último año pagado: " + esc(r["Último año pagado"] || "—") + (r["Próxima fecha límite (auto)"] ? " · límite " + esc(r["Próxima fecha límite (auto)"]) : "") : "Última verificación: " + esc(r["Última verificación"] || "—") + (r["Bimestre aplicado (auto)"] ? " · le toca " + esc(r["Bimestre aplicado (auto)"]) : "")}</p>
    ${ref ? `<div class="dos"><div><label>Año que se pagó</label><input id="vp-a" type="number" inputmode="numeric" value="${new Date().getFullYear()}"></div><div><label>Fecha de pago</label><input id="vp-f" type="date" value="${hoyISO()}" max="${hoyISO()}"></div></div>`
      : `<label>Fecha de la verificación</label><input id="vp-f" type="date" value="${hoyISO()}" max="${hoyISO()}">`}
    <label>Nota (opcional)</label><input id="vp-n" maxlength="150">
    ${campoFotos("Comprobante (opcional)", true)}
    <button class="btn btn-dark" id="d-ok" type="button">Guardar</button></div>`);
  activarFotos(box);
  box.querySelector("#d-ok").onclick = () => { const g = q => ((box.querySelector(q) || {}).value || "").trim();
    vehEnviar(box, {tipo: "vehiculo", op, id, anio: g("#vp-a"), fecha: g("#vp-f"), notas: g("#vp-n")}, ref ? "Refrendo guardado" : "Verificación guardada"); };
}
function vehHistorial(id) {
  const v = VEHS.vehiculos.find(x => x["ID"] === id); if (!v) return;
  const B = (VEHS.bitacora || []).filter(x => x["ID"] === id).slice().reverse();
  const datos = [["Marca / modelo", v["Marca / Modelo"]], ["Versión", v["Versión / Características"]], ["Año", v["Año"]], ["Color", v["Color"]], ["Placas", v["Placas"]], ["Propietario", v["Propietario (factura)"]], ["NIV", v["NIV (No. de Serie)"]], ["Motor", v["No. de Motor"]], ["Notas", v["Notas"]]].filter(x => x[1]);
  dialogo("Historial · " + vehNom(v), `<div class="frm"><p class="card-m">${datos.map(([k, x]) => `<b>${esc(k)}:</b> ${esc(x)}`).join("<br>")}</p>
    <h3>Bitácora</h3>${B.map(x => `<article class="card"><p class="card-t">${esc(x["Fecha"] || "")} · ${esc(x["Tipo de registro"] || "")}${x["Lectura (km u hrs)"] ? " · " + esc(x["Lectura (km u hrs)"]) : ""}</p>
      <p class="card-m">${[x["Descripción"], x["Taller / Proveedor"], x["Costo"], x["Registró"] ? "anotó " + x["Registró"] : ""].filter(Boolean).map(esc).join(" · ")}${x["Notas"] ? `<br>${esc(x["Notas"]).replace(/(https:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">ver archivo</a>')}` : ""}</p></article>`).join("") || `<p class="card-m">Sin registros todavía.</p>`}</div>`);
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.vehArea) { st.vehArea = d.vehArea; render(); return; }
  if (d.vehIr) return ir("vehiculos");
  if (d.vehLect || d.vehServ || d.vehSeg || d.vehRef || d.vehVer || d.vehHist) {
    if (!d.vehHist && COMO) return toast("Estás en \"Ver como\": solo se puede ver.");
    try { await cargar("vehiculos"); } catch (err) { return alert(err.message); }
    if (d.vehLect) return dialogoVehBitacora(d.vehLect, "lectura");
    if (d.vehServ) return dialogoVehBitacora(d.vehServ, "servicio");
    if (d.vehSeg) return dialogoVehSeguro(d.vehSeg);
    if (d.vehRef) return dialogoVehPapel(d.vehRef, "refrendo");
    if (d.vehVer) return dialogoVehPapel(d.vehVer, "verificacion");
    if (d.vehHist) return vehHistorial(d.vehHist);
  }
  if (d.cajaForma) { // corregir cómo se pagó un gasto
    if (COMO) return toast("Estás en \"Ver como\": solo se puede ver.");
    const x = CAJA && CAJA.movimientos.find(m => m.ID === d.cajaForma); if (!x) return;
    const actual = x["Forma de pago"] || CC_FORMAS[0];
    const box = dialogo("¿Cómo se pagó? · " + (x["Concepto"] || ""), `<div class="frm"><p class="ctx">${money(numv(x["Monto"]))} · hoy dice ${esc(CC_FP_TXT[actual])}</p>
      <div class="rads">${CC_FORMAS.map(f => `<label class="rad"><input type="radio" name="cf" value="${esc(f)}"${f === actual ? " checked" : ""}> <span><b>${esc(CC_FP_TXT[f])}</b></span></label>`).join("")}</div>
      <button class="btn btn-dark" id="d-ok" type="button">Guardar</button></div>`);
    box.querySelector("#d-ok").onclick = () => { const f = (box.querySelector("input[name=cf]:checked") || {}).value; if (!f || f === actual) return $("#dlg").close();
      enviar(box, {tipo: "caja", op: "forma", id: x.ID, forma: f}, "Listo: quedó como " + CC_FP_TXT[f]); };
  }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1) || "hoy"; if (YO && h !== ACTUAL && (YO.permisos.secciones.includes(h) || h === "menu")) ir(h); });
iniciar();
</script>
