<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="same-origin">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Equipo · Rancho El Descanso</title>
<link rel="icon" href="/app-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Portal del equipo (1 oct 2026). Datos: /api/equipo (cada rol recibe solo lo suyo). */
:root{
  --black:#000; --ink:#0A0A0A; --paper:#fff; --mist:#F4F3F0; --muted:#5E5B55; --rule:rgba(0,0,0,.12);
  --gold:#CEB35C; --gold-deep:#A3853C; --gold-light:#E0C068;
  --ok:#1f7a3d; --ok-bg:#e6f3ea; --warn:#8a5a00; --warn-bg:#fdf1d6; --bad:#b3261e; --bad-bg:#fbe6e4; --info-bg:#eceae4;
  --display:'Marcellus',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hide{display:none!important}
.ev-mini{background:#fff;border:1px solid var(--rule);border-radius:12px;margin:0 0 8px}.ev-mini>summary{padding:12px 14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.ev-mini>summary>span{flex:1;min-width:0}.ev-mini>summary::-webkit-details-marker{display:none}
.ev-mini>summary::after{content:"Ver ▾";flex:none;color:var(--gold-deep);font-size:.85rem}.ev-mini[open]>summary::after{content:"Ocultar ▴"}.ev-mini .card{border:0;margin:0;box-shadow:none}
.qa.qa-ya{border-color:var(--gold);background:#fffaf0}.qa small{display:block;color:var(--muted);font-size:.8rem}
.es-tabla{border:1px solid var(--rule);border-radius:12px;background:#fff;overflow:hidden;text-align:left}
.es-r{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--rule)}.es-r:last-child{border-bottom:0}
.es-r small{display:block;color:var(--muted);font-size:.85rem}.es-r .n{white-space:nowrap;font-variant-numeric:tabular-nums}
.es-r.ant{background:var(--mist)}.es-r.pago .n{color:var(--ok)}.es-tot{background:var(--ink);color:#fff}.es-tot .n{font-weight:600}
.es-acc{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.es-acc .btn{padding:4px 10px;font-size:.85rem}

/* barra superior */
.top{position:sticky;top:0;z-index:5;background:var(--black);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0}
.top-row{display:flex;align-items:center;gap:12px;max-width:1200px;margin:0 auto}
.top-row img{height:28px;width:auto}
.top-row h1{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:.85rem;color:rgba(255,255,255,.75);text-align:right;line-height:1.2}
.who b{display:block;color:#fff;font-weight:500}
.btn-out{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer}
#b-regl{border-color:transparent;color:rgba(255,255,255,.7);padding:6px 8px}#b-regl:hover{color:#fff}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1200px;margin:10px auto 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.7);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;font-weight:500}
.tab[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}

main{max-width:1200px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:8px 0 12px}
h3{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:22px 0 10px}
.sub{color:var(--muted);margin:-6px 0 14px;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--black);color:var(--gold);border-color:var(--black)}
.search{flex:1;min-width:180px;border:1px solid var(--rule);border-radius:999px;padding:8px 14px;background:#fff}

/* tarjetas y tablas */
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.kpi{background:#fff;border-radius:12px;padding:14px;border:1px solid var(--rule)}
.kpi span{display:block;color:var(--muted);font-size:.82rem}
.kpi b{font-family:var(--display);font-weight:400;font-size:1.5rem}
.day{margin:0 0 18px}
.day-h{font-weight:600;font-size:.9rem;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;align-items:baseline}
.day-h small{font-weight:400}
.card{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px;margin:0 0 8px}
.card-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.card-t{font-weight:600;margin:0}
.card-m{color:var(--muted);font-size:.92rem;margin:2px 0 0}
.time{font-family:var(--display);font-size:1.3rem;min-width:62px;line-height:1.1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0 0;font-size:.93rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;border:1px solid var(--rule);background:#fff;cursor:pointer;text-decoration:none;font-size:.9rem;font-weight:500}
.btn-dark{background:var(--black);color:var(--gold);border-color:var(--black)}
.btn-wa{background:#25D366;color:#fff;border-color:#25D366}
.btn[disabled]{opacity:.5;cursor:default}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:var(--info-bg);color:var(--muted)}
.regl{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:6px 18px 14px;max-width:860px}
.regl h2{font-size:1.35rem;margin:14px 0 4px}.regl h3{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:22px 0 6px;color:var(--gold-deep)}
.regl p,.regl li{max-width:70ch}.regl ul,.regl ol{padding-left:22px;margin:6px 0 10px}.regl li{margin:3px 0}.regl .tbl-wrap{margin:8px 0 12px}
.regl-ok{position:sticky;bottom:0;max-width:860px;background:var(--mist);border-top:1px solid var(--rule);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.regl-ok label{display:flex;gap:8px;align-items:flex-start;font-weight:500}.regl-ok input{width:22px;height:22px;margin-top:2px;accent-color:var(--black)}
.regl-ok .btn{padding:12px 22px;font-size:1rem}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--rule);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;background:#faf9f6;position:sticky;top:0}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.empty{background:#fff;border:1px dashed var(--rule);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.err{background:var(--bad-bg);color:var(--bad);border-radius:12px;padding:14px;margin:0 0 12px}
.load{color:var(--muted);padding:24px 0}
details.more summary{cursor:pointer;color:var(--gold-deep);font-size:.9rem;margin-top:8px}
details.more pre{white-space:pre-wrap;font-family:inherit;font-size:.88rem;color:var(--muted);margin:6px 0 0}

/* login */
.login{min-height:100dvh;display:grid;place-items:center;background:var(--black);padding:24px}
.login-box{width:100%;max-width:380px;text-align:center;color:#fff}
.login-box img{width:200px;max-width:70%;height:auto;margin:0 auto 18px;display:block}
.login-box h1{font-family:var(--display);font-weight:400;color:var(--gold);font-size:1.6rem;margin:0 0 6px}
.login-box p{color:rgba(255,255,255,.7);margin:0 0 20px}
.login-box input{width:100%;padding:13px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:#111;color:#fff;margin:0 0 10px}
.login-box .btn-dark{width:100%;justify-content:center;background:var(--gold);color:#000;border-color:var(--gold);padding:13px}
.login-msg{min-height:1.5em;margin:12px 0 0;color:var(--gold-light);font-size:.95rem}
.sep{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.4);margin:18px 0;font-size:.85rem}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.15)}
#g-btn{display:flex;justify-content:center}

/* visor de identificación */
dialog{border:0;border-radius:14px;padding:0;max-width:min(720px,96vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.75)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}
.dlg-b{padding:16px;max-height:80dvh;overflow:auto;text-align:center}
.dlg-b img{max-width:100%;height:auto}
.dlg-b iframe{width:100%;height:70dvh;border:0}
.dlg-b textarea,.dlg-b input{width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px;margin:0 0 10px;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--black);color:var(--gold);padding:10px 18px;border-radius:999px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.frm{text-align:left}
.frm label{display:block;font-size:.88rem;color:var(--muted);margin:0 0 4px}
.frm input,.frm select,.frm textarea{width:100%;border:1px solid var(--rule);border-radius:10px;padding:11px 12px;margin:0 0 12px;background:#fff;font-size:1rem}
.frm .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .frm .tres label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frm .btn-dark{width:100%;justify-content:center;padding:13px;font-size:1rem}
.fotos-prev{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.fotos-prev img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--rule)}
.foto-btn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--gold-deep);border-radius:12px;padding:14px;margin:0 0 12px;color:var(--gold-deep);font-weight:600;cursor:pointer;background:#fffdf6}
.foto-btn input{display:none}
.big-actions{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.big-actions .btn{padding:12px 18px;font-size:1rem}
.t-vencida{color:var(--bad);font-weight:600}
.prio-Alta{border-left:4px solid var(--bad)} .prio-Normal{border-left:4px solid var(--gold)} .prio-Baja{border-left:4px solid var(--rule)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.galeria img{width:100%;border-radius:10px}
.mes{border:1px solid var(--rule);border-radius:999px;padding:7px 14px;background:#fff}
details.prov{background:#fff;border:1px solid var(--rule);border-radius:12px;margin:0 0 8px;padding:12px 14px}
details.prov summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none}
details.prov summary::-webkit-details-marker{display:none}
/* navegación (3 oct 2026): en celular, menú de cuadros grandes y cada sección en su página con "← Menú";
   en computadora, lista vertical fija a la izquierda */
.backbar{display:none}
.menu-hola{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:6px 0 2px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 0}
.menu-tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:120px;padding:18px 10px;background:#fff;border:1px solid var(--rule);border-radius:16px;cursor:pointer;font-weight:600;font-size:1.05rem;line-height:1.2;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.menu-tile .ico{font-size:2.1rem;line-height:1}
.menu-tile:active{transform:scale(.98);background:#faf8f2}
.menu-tile .n{position:absolute;top:10px;right:10px;background:var(--gold);color:#000;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;padding:0 7px;font-size:.85rem;font-weight:700}
.tab .ico{display:none}
@media (max-width:899px){
  .tabs{display:none}
  .top{padding-bottom:10px}
  .backbar.on{display:flex;align-items:center;gap:12px;max-width:1200px;margin:10px auto 0}
  .btn-back{background:var(--gold);color:#000;border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:1rem;cursor:pointer;white-space:nowrap}
  .backbar b{font-family:var(--display);font-weight:400;font-size:1.2rem;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (min-width:900px){
  .top{padding-bottom:10px}
  .tabs{position:fixed;left:0;top:var(--hdr,58px);bottom:0;width:230px;flex-direction:column;gap:2px;margin:0;padding:14px 10px 24px;background:var(--black);overflow-y:auto;border-top:1px solid rgba(255,255,255,.08)}
  .tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-bottom:0;border-left:3px solid transparent;border-radius:0 10px 10px 0;padding:11px 14px;font-size:.98rem}
  .tab .ico{display:inline;font-size:1.15rem;width:1.4em;text-align:center}
  .tab:hover{color:#fff;background:rgba(255,255,255,.05)}
  .tab[aria-selected=true]{border-left-color:var(--gold);background:rgba(206,179,92,.12)}
  main{margin-left:230px;max-width:none;padding-left:28px;padding-right:28px}
  .top-row{max-width:none}
}
/* Inicio (4 oct 2026): pantalla de Hoy para cada quien + barra fija abajo en celular */
.bnav{display:none}
.hoy-acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0 4px}
.qa{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px;font-weight:600;font-size:1rem;cursor:pointer;text-align:left;min-height:64px;line-height:1.25}
.qa .ico{font-size:1.55rem;line-height:1;flex:none}
.qa.dark{background:var(--black);color:#fff;border-color:var(--black)}
.qa:active{transform:scale(.98)}
.blk{margin:24px 0 0}
.blk>h3{margin:0 0 10px}
.blk-dec{background:#fffaf0;border:1px solid var(--gold);border-radius:14px;padding:4px 14px 14px}
.blk-dec>h3{margin-top:12px}
.lbl{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:14px 0 6px}
.lbl.rojo{color:var(--bad)} .lbl.oro{color:var(--gold-deep)} .lbl.gris{color:var(--muted)}
details.mas{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin:10px 0 0}
details.mas>summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.mas[open]>summary{margin-bottom:10px}
.linea{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 14px;margin:8px 0 0;color:var(--muted);font-size:.95rem}
.linea b{color:var(--ink)}
.mini-lista{margin:0;padding:0;list-style:none}
.mini-lista li{padding:7px 0;border-bottom:1px solid var(--rule);font-size:.95rem}.mini-lista li:last-child{border-bottom:0}
.como-bar{background:var(--gold);color:#000;padding:8px 16px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:.95rem}
.como-bar button{background:#000;color:var(--gold);border:0;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
body.como main .acts,body.como main .big-actions,body.como .hoy-acts,body.como .bnav .plus,body.como main .r-hero{pointer-events:none;opacity:.4}
.vercomo{display:flex;gap:8px;align-items:center;margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.vercomo select{border:1px solid var(--rule);border-radius:999px;padding:6px 10px;background:#fff;font-size:.9rem}
.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.75rem;font-weight:600;background:var(--info-bg);color:var(--muted);margin-left:4px;vertical-align:middle}
.tag.oro{background:#fdf1d6;color:var(--warn)}
.chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:0 0 6px}
.chkgrid label.chk{margin:0 0 6px}
.qa-lista{display:grid;gap:10px}
@media (max-width:899px){
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--black);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.12)}
  .bnav button{position:relative;background:none;border:0;color:rgba(255,255,255,.72);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:.78rem;font-weight:500;padding:6px 2px;cursor:pointer;min-height:56px}
  .bnav .ico{font-size:1.45rem;line-height:1}
  .bnav button[aria-current=true]{color:var(--gold)}
  .bnav .plus .ico{background:var(--gold);color:#000;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-weight:600;margin-top:-20px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .bnav .n{position:absolute;top:3px;left:calc(50% + 6px);background:var(--gold);color:#000;border-radius:999px;min-width:20px;height:20px;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
  main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:900px){ .cel-only{display:none} }
@media (max-width:600px){ .card-h{flex-wrap:wrap} .card-h>div[style*="flex:1"]{min-width:55%!important} }
/* redes sociales */
.r-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:0 0 18px}
.r-big{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:0;border-radius:16px;padding:20px;background:var(--black);color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.12);min-height:118px}
.r-big .ico{font-size:1.9rem;line-height:1;margin-bottom:4px}
.r-big b{font-family:var(--display);font-weight:400;font-size:1.4rem;color:var(--gold);line-height:1.2}
.r-big span:not(.ico){color:rgba(255,255,255,.75);font-size:.95rem}
.r-alt{background:#fff;color:var(--ink);border:1px solid var(--rule);box-shadow:none}.r-alt b{color:var(--ink)}.r-alt span:not(.ico){color:var(--muted)}
.r-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.r-tile{position:relative;display:block;width:100%;border-radius:12px;overflow:hidden;background:#e7e4dc;aspect-ratio:1;border:0;padding:0;cursor:pointer}
.r-tile img{width:100%;height:100%;object-fit:cover;display:block}
.r-sin{display:grid;place-items:center;height:100%;color:var(--muted);font-weight:600}
.r-play{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:999px;padding:2px 9px;font-size:.75rem}
.r-tile .badge{position:absolute;top:8px;right:8px}
.r-cap{font-size:.82rem;color:var(--muted);margin:5px 2px 0;line-height:1.35}
.r-mini{padding:4px 10px;font-size:.8rem;margin-top:4px}
.r-media{display:flex;gap:8px;overflow-x:auto;margin:12px 0 0}.r-media>div{flex:0 0 140px}
.r-texto{white-space:pre-wrap;margin:10px 0 0}
.r-temas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.r-tema{border:2px solid var(--rule);background:#fff;border-radius:12px;padding:14px 8px;font-weight:600;cursor:pointer;font-size:1rem}
.r-tema[aria-pressed=true]{border-color:var(--black);background:var(--black);color:var(--gold)}
.r-step{font-weight:600;margin:6px 0 8px;font-size:1.05rem}
.r-pick{padding:22px 14px;font-size:1.05rem}
.r-prog{height:12px;background:var(--mist);border-radius:999px;overflow:hidden;margin:6px 0 4px}.r-prog i{display:block;height:100%;width:0;background:var(--gold-deep);transition:width .2s}
.r-ok-big{text-align:center;padding:8px 0}.r-ok-big .ico{font-size:3rem}.r-ok-big h3{margin:6px 0}
.r-ap{padding:10px 20px;font-size:1rem}
.r-kpi .kpi span+span{margin-top:4px}
@media (max-width:600px){ .who span{display:none} .time{min-width:52px;font-size:1.15rem} .frm .dos{grid-template-columns:1fr} }
@media (max-width:420px){ .frm .tres{grid-template-columns:1fr} .frm .tres label{white-space:normal} }
/* cancelar y reagendar (3 oct 2026) */
.ctx{background:var(--mist);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:.95rem}
.rads{display:grid;gap:8px;margin:0 0 14px}
.frm label.rad{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font-size:.95rem;margin:0;background:#fff}
.frm label.rad:has(input:checked){border-color:var(--gold);background:#fffaf0}
.frm label.rad.off{opacity:.6;cursor:default}
.frm .rad input,.frm .chk input{width:auto;margin:3px 0 0;flex:none}
.rad small{display:block;color:var(--muted);font-size:.85rem}
.frm label.chk{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:.95rem;margin:0 0 12px}
.frm label.chk[hidden]{display:none}
.cp-ali{display:grid;gap:8px} .cp-a{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.cp-a b{grid-column:1} .cp-a span{grid-column:1;font-size:.9rem} .cp-a .btn{grid-column:2;grid-row:1/4} .cp-a.bajo{border-color:var(--bad);background:var(--bad-bg)}
.sv-paso{font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 12px}
.sv-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;border-bottom:1px solid var(--rule);padding:9px 2px}
.sv-row.on .sv-nom b{color:var(--gold-deep)} .sv-nom small{display:block;color:var(--muted);font-size:.8rem}
.sv-ops{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end} .sv-ops .chip{font-size:.82rem;padding:5px 9px}
.frm .sv-otro,.sv-row .sv-mas{grid-column:1/-1} .frm .sv-precio{width:96px;margin:0;text-align:right}
.sv-mas summary{font-size:.82rem;color:var(--muted);cursor:pointer} .sv-mas input,.sv-mas select{margin:6px 0 0}
.sv-grupo{border:1px solid var(--rule);border-radius:12px;padding:0 12px;margin:0 0 8px;background:#fff}
.sv-grupo summary{display:flex;justify-content:space-between;align-items:center;padding:12px 0;cursor:pointer;font-weight:600}
.sv-grupo[open] summary{border-bottom:1px solid var(--rule)} .sv-grupo .sv-row:last-child{border-bottom:0}
.sv-pie{position:sticky;bottom:-1px;background:var(--paper,#fff);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0 4px;margin-top:12px;border-top:1px solid var(--rule)}
.sv-pie b{font-size:.9rem;text-align:center} .sv-repetir{width:100%;margin:6px 0 0;justify-content:center} .sv-repetir small{color:var(--muted);font-weight:400}
.sv-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px} .sv-chips .chip{font-size:.85rem;padding:5px 10px}
.kpi.bajo{border-color:var(--bad);background:var(--bad-bg)} .kpi.bajo b{color:var(--bad)}
.cc-monto{font-family:var(--display);font-size:1.2rem;white-space:nowrap} .cc-menos{color:var(--bad)} .cc-mas{color:var(--ok)}
.aviso{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0 0 12px}
.ok-big{font-family:var(--display);font-size:1.4rem;color:var(--ok);text-align:center;margin:0 0 12px}
.frm .btn-wa{width:100%;justify-content:center;padding:13px;font-size:1rem;margin:0 0 10px}
</style>

<body>

<section class="login hide" id="login">
  <div class="login-box">
    <img src="/marca/logo-horizontal-oro-blanco.png" alt="Rancho El Descanso">
    <h1>Portal del equipo</h1>
    <p>Entra con el correo que tienes dado de alta.</p>
    <div id="g-wrap" class="hide"><div id="g-btn"></div><div class="sep">o con una liga a tu correo</div></div>
    <form id="f-login" novalidate>
      <input type="email" id="l-email" placeholder="tu@correo.com" autocomplete="email" required>
      <button class="btn btn-dark" type="submit">Mandarme la liga de acceso</button>
    </form>
    <p class="login-msg" id="l-msg" role="status"></p>
  </div>
</section>

<div id="app" class="hide">
  <header class="top">
    <div class="top-row">
      <img src="/marca/simbolo-oro.png" alt="">
      <h1>Equipo · Rancho El Descanso</h1>
      <div class="who"><b id="u-nombre"></b><span id="u-rol"></span></div>
      <button class="btn-out" id="b-regl" type="button" onclick="ir('reglamento')">Reglamento</button>
      <button class="btn-out" id="b-salir" type="button">Salir</button>
    </div>
    <div class="backbar" id="backbar"><button class="btn-back" id="b-menu" type="button">← Menú</button><b id="sec-t"></b></div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <div class="como-bar hide" id="como-bar"></div>
  <main id="main"></main>
  <nav class="bnav" id="bnav" aria-label="Navegación"></nav>
</div>

<dialog id="dlg"><div class="dlg-h"><strong id="dlg-t"></strong><button class="btn" type="button" id="dlg-x">Cerrar</button></div><div class="dlg-b" id="dlg-b"></div></dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + Math.round(Number(n) || 0).toLocaleString("es-MX");
const numv = s => Number(String(s ?? "").replace(/[^0-9.\-]/g, "")) || 0;
const TZ = "America/Mexico_City";
const hoyISO = () => new Intl.DateTimeFormat("en-CA", {timeZone: TZ}).format(new Date());
const masDias = (iso, n) => { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fDia = iso => { const t = new Date(iso + "T12:00:00Z").toLocaleDateString("es-MX", {weekday: "long", day: "numeric", month: "long", timeZone: "UTC"}); return t.charAt(0).toUpperCase() + t.slice(1); };
const fHora = iso => new Date(iso).toLocaleTimeString("es-MX", {hour: "2-digit", minute: "2-digit", hour12: false, timeZone: TZ});
const fFecha = iso => new Date(iso).toLocaleDateString("es-MX", {day: "numeric", month: "short", year: "2-digit", timeZone: TZ});
const ROLES = {admin: "Administración", direccion: "Ventas y eventos", ventas: "Ventas", contabilidad: "Contabilidad", campo: "Rancho", medico: "Médico"};
const SECCIONES = {hoy: "Inicio", tareas: "Tareas", cotizaciones: "Cotizaciones", agenda: "Agenda", clientes: "Reservas y clientes", eventos: "Eventos por confirmar", cambios: "Cancelar y reagendar", pagos: "Pagos y saldos", estados: "Estados de cuenta", caballos: "Caballos y ventas",
  comisiones: "Comisiones", caja: "Caja chica", herrajes: "Herrajes", compras: "Alimento y compras", redes: "Redes", salud: "Salud de caballos", bitacora: "Bitácora", proveedores: "Proveedores", conta: "Contabilidad", equipo: "Equipo", reglamento: "Reglamento"};
const ICONOS = {hoy: "🏠", tareas: "✅", cotizaciones: "💬", agenda: "🗓️", clientes: "👥", eventos: "⏳", cambios: "🔁", pagos: "💳", estados: "🧾", caballos: "🐴", comisiones: "💰", caja: "💵", herrajes: "🔨", compras: "📦", redes: "📷", salud: "🩺", bitacora: "📝", proveedores: "🚚", conta: "📊", equipo: "👤", reglamento: "📖"};
const esCel = () => window.matchMedia("(max-width:899px)").matches;
const AREAS = ["Caballos", "Salud", "Reproducción", "Jardinería", "Mantenimiento", "Alimentación", "Instalaciones", "Eventos y sesiones", "Ventas", "Contabilidad", "Administración", "Otro"];
const TIPOS_SALUD = ["Revisión", "Vacuna", "Desparasitación", "Herraje / cascos", "Dental", "Tratamiento", "Lesión o cólico", "Monta / inseminación", "Palpación / ecografía", "Parto", "Destete", "Trámite KFPS / GVHS", "Otro"];
const TIPOS_BITACORA = ["Avance", "Problema", "Falta material o compra", "Aviso", "Otro"];
const CATS_GASTO = ["Alimento", "Veterinario", "Medicamentos", "Herraje", "Mantenimiento", "Jardinería", "Sueldos", "Luz y agua", "Gasolina", "Eventos", "Papelería y trámites", "Otro"];
const TIPO_PAGO = {sesion: "Sesión", evento: "Evento", caballo: "Caballo", potro: "Potro 2027", saldo_sesion: "Resto de sesión"};

let COMO = "", COMO_NOM = ""; // "Ver como…" (Mario y Nico): solo lectura
let FUERA = null, EST = null, COMP = null, SERV = null, CAJA = null, CAMBIOS = null, REDES = null, REG = null, YO = null, AGENDA = null, PAGOS = null, CABALLOS = null, ACTUAL = "hoy", TAREAS = null, REPORTES = null, CONTA = null, EQUIPO = null, COTIZ = null;
const st = {agendaFiltro: "todo", busca: "", tFiltro: "pendientes", bArea: "todo", sCaballo: "", mes: "", qFiltro: "abiertas", rTab: "inicio"};

function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
async function api(q) { const r = await fetch("/api/equipo?" + q + (COMO ? "&como=" + encodeURIComponent(COMO) : ""), {credentials: "same-origin", cache: "no-store"}); const j = await r.json().catch(() => ({}));
  if (r.status === 401) { mostrarLogin(j.google); throw new Error("sin sesión"); } if (!r.ok) throw new Error(j.error || "Error " + r.status); return j; }
async function post(body) { if (COMO) throw new Error("Estás viendo el portal como " + COMO_NOM + ": solo se puede ver. Vuelve a tu vista para hacer cambios.");
  const r = await fetch("/api/equipo", {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json", "x-equipo": "1"}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({})); if (r.status === 401 && body.accion === "hacer") { mostrarLogin(); } if (!r.ok) throw new Error(j.error || "Error " + r.status); return j; }

/* ---------- entrada ---------- */
function mostrarLogin(google) {
  const c = new URLSearchParams(location.search).get("c");
  if (c) { let u = 0; try { u = Number(sessionStorage.getItem("reentrar")) || 0; } catch (e) {}
    if (Date.now() - u > 60e3) { try { sessionStorage.setItem("reentrar", String(Date.now())); } catch (e) {}
      location.replace("/api/equipo?entrar=" + encodeURIComponent(c)); return; } }
  $("#app").classList.add("hide"); $("#login").classList.remove("hide");
  if (new URLSearchParams(location.search).get("liga") === "vencida") $("#l-msg").textContent = "Esa liga ya venció o no es válida. Pide una nueva.";
  if (google && !window.__gsi) { window.__gsi = 1; const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = () => { google_init(google); }; document.head.appendChild(s); }
}
function google_init(id) {
  if (!window.google || !google.accounts) return;
  $("#g-wrap").classList.remove("hide");
  google.accounts.id.initialize({client_id: id, callback: async r => {
    try { await post({accion: "google", credential: r.credential}); location.replace("/equipo/"); } catch (e) { $("#l-msg").textContent = e.message; } }});
  google.accounts.id.renderButton($("#g-btn"), {theme: "filled_black", size: "large", shape: "pill", text: "signin_with", locale: "es"});
}
$("#f-login").addEventListener("submit", async e => {
  e.preventDefault(); const email = $("#l-email").value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) { $("#l-msg").textContent = "Escribe un correo válido."; return; }
  $("#l-msg").textContent = "Enviando…";
  try { await post({accion: "enlace", email}); $("#l-msg").textContent = "Si tu correo tiene acceso, te llegó una liga para entrar (revisa también spam). Sirve 15 minutos."; }
  catch (err) { $("#l-msg").textContent = err.message; }
});
$("#b-salir").addEventListener("click", async () => { try { await post({accion: "salir"}); } catch (e) {} location.replace("/equipo/"); });

/* ---------- arranque ---------- */
async function iniciar() {
  try { YO = await api("accion=yo"); } catch (e) { return; }
  { const c = new URLSearchParams(location.search).get("c"); history.replaceState(null, "", "/equipo/" + (c ? "?c=" + encodeURIComponent(c) : "") + location.hash); }
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  if (!COMO) { $("#u-nombre").textContent = YO.usuario.nombre; $("#u-rol").textContent = (YO.org && YO.org.puesto) || ((ROLES[YO.usuario.rol] || YO.usuario.rol) + (YO.usuario.area ? " · " + YO.usuario.area : "")); }
  document.body.classList.toggle("como", !!COMO);
  $("#como-bar").classList.toggle("hide", !COMO);
  $("#como-bar").innerHTML = COMO ? `<span>👁️ Estás viendo el portal como <b>${esc(YO.usuario.nombre)}</b> (solo ver)</span><button type="button" onclick="verComo('')">Volver a mi vista</button>` : "";
  armarPortal();
}
/* Reglamento: botón discreto arriba (no es pestaña ni se pide al entrar); aceptarlo es opcional */
async function verComo(id) {
  COMO = id; COMO_NOM = id && YO.gente ? ((YO.gente.find(x => x.id === id) || {}).nombre || "") : "";
  FUERA = EST = COMP = SERV = CAJA = CAMBIOS = REDES = REG = AGENDA = PAGOS = CABALLOS = TAREAS = REPORTES = CONTA = EQUIPO = COTIZ = null;
  location.hash = "hoy"; await iniciar(); window.scrollTo(0, 0);
}
async function aceptarReglamento(b) {
  b.disabled = true; b.textContent = "Guardando…";
  try { await post({accion: "hacer", tipo: "reglamento_aceptar", huella: REG.huella}); REG = null; toast("Listo. Gracias por aceptar el reglamento."); render(); }
  catch (e) { toast(e.message); b.disabled = false; b.textContent = "Leí y acepto"; }
}
function armarPortal() {
  const secs = YO.permisos.secciones.filter(s => s !== "reglamento");
  $("#tabs").innerHTML = secs.map(s => `<button class="tab" role="tab" data-s="${s}" aria-selected="false"><span class="ico" aria-hidden="true">${ICONOS[s] || "•"}</span>${SECCIONES[s]}</button>`).join("");
  /* celular: barra fija abajo · Inicio · Tareas · ➕ · Más (todas las secciones) */
  $("#bnav").innerHTML = `<button type="button" data-bn="hoy"><span class="ico" aria-hidden="true">🏠</span>Inicio</button>
    ${secs.includes("tareas") ? `<button type="button" data-bn="tareas"><span class="ico" aria-hidden="true">✅</span>Tareas<span class="n hide" id="bn-n"></span></button>` : ""}
    <button type="button" class="plus" data-bn="mas-accion" aria-label="Reportar, registrar o pedir"><span class="ico" aria-hidden="true">+</span>Nuevo</button>
    <button type="button" data-bn="menu"><span class="ico" aria-hidden="true">☰</span>Más</button>`;
  $("#bnav").style.gridTemplateColumns = `repeat(${secs.includes("tareas") ? 4 : 3},1fr)`;
  if (!window.__tabs) { window.__tabs = 1; $("#tabs").addEventListener("click", e => { const b = e.target.closest(".tab"); if (b) ir(b.dataset.s); });
    $("#bnav").addEventListener("click", e => { const b = e.target.closest("[data-bn]"); if (!b) return; if (b.dataset.bn === "mas-accion") abrirAcciones(); else ir(b.dataset.bn); });
    const alto = () => document.documentElement.style.setProperty("--hdr", $(".top").offsetHeight + "px"); alto(); window.addEventListener("resize", () => { alto(); if (!esCel() && ACTUAL === "menu") ir("hoy"); }); }
  let h = location.hash.slice(1); if (h === "servicios") h = secs.includes("herrajes") ? "herrajes" : "salud"; if (h === "medicos") { h = "salud"; st.saTab = "jornadas"; }
  ir(secs.includes(h) || h === "reglamento" ? h : secs.includes("hoy") ? "hoy" : secs[0]);
}
function ir(s) {
  if (s === "menu" && !esCel()) s = "hoy";
  ACTUAL = s; if (location.hash.slice(1) !== s) location.hash = s; window.scrollTo(0, 0);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.s === s));
  document.querySelectorAll("#bnav [data-bn]").forEach(b => b.setAttribute("aria-current", b.dataset.bn === s || (b.dataset.bn === "menu" && !["hoy", "tareas"].includes(s))));
  $("#sec-t").textContent = SECCIONES[s] || "";
  document.documentElement.style.setProperty("--hdr", $(".top").offsetHeight + "px");
  render();
}
async function cargar(qué) {
  if (qué === "agenda" && !AGENDA) AGENDA = await api(`accion=agenda&desde=${masDias(hoyISO(), -30)}&hasta=${masDias(hoyISO(), 180)}`);
  if (qué === "pagos" && !PAGOS) PAGOS = await api("accion=pagos");
  if (qué === "caballos" && !CABALLOS) CABALLOS = await api("accion=caballos");
  if (qué === "tareas" && !TAREAS) TAREAS = await api("accion=tareas");
  if (qué === "reportes" && !REPORTES) REPORTES = await api("accion=reportes");
  if (qué === "conta" && !CONTA) CONTA = await api("accion=conta");
  if (qué === "equipo" && !EQUIPO) EQUIPO = await api("accion=equipo_lista");
  if (qué === "cotizaciones" && !COTIZ) COTIZ = await api("accion=cotizaciones");
  if (qué === "reglamento" && !REG) REG = await api("accion=reglamento");
  if (qué === "redes" && !REDES) REDES = await api("accion=redes");
  if (qué === "cambios" && !CAMBIOS) CAMBIOS = await api("accion=cambios");
  if (qué === "caja" && !CAJA) CAJA = await api("accion=caja");
  if (qué === "servicios" && !SERV) SERV = await api("accion=servicios");
  if (qué === "compras" && !COMP) COMP = await api("accion=compras");
  if (qué === "fuera" && !FUERA) FUERA = await api("accion=fuera");
  if (qué === "estados" && (!EST || EST.mes !== (st.estMes || EST.mes))) EST = await api("accion=estados" + (st.estMes ? "&mes=" + st.estMes : ""));
}
const tiene = s => YO.permisos.secciones.includes(s);
async function render() {
  const m = $("#main"); m.innerHTML = `<p class="load">Cargando…</p>`;
  try {
    const s = ACTUAL;
    if (s === "menu") { if (tiene("tareas")) await cargar("tareas").catch(() => {}); if ((tiene("herrajes") || tiene("salud")) && YO.permisos.dinero === "todo") await cargar("servicios").catch(() => {}); if (tiene("compras")) await cargar("compras").catch(() => {}); if (tiene("caja")) await cargar("caja").catch(() => {}); if (tiene("redes") && YO.permisos.acciones.includes("redes_aprobar")) await cargar("redes").catch(() => {});
      pintarContador(); if (ACTUAL === "menu") m.innerHTML = vMenu(); return; }
    if (["agenda", "clientes", "eventos"].includes(s)) await cargar("agenda");
    if (s === "hoy") await Promise.all([tiene("agenda") ? cargar("agenda").catch(() => {}) : 0, tiene("tareas") ? cargar("tareas").catch(() => {}) : 0,
      tiene("salud") || tiene("bitacora") ? cargar("reportes").catch(() => {}) : 0, tiene("caja") ? cargar("caja").catch(() => {}) : 0,
      (tiene("herrajes") || tiene("salud")) && YO.permisos.dinero === "todo" ? cargar("servicios").catch(() => {}) : 0, tiene("compras") ? cargar("compras").catch(() => {}) : 0]);
    if ((s === "hoy" && tiene("cotizaciones")) || s === "cotizaciones") await cargar("cotizaciones").catch(e => { if (s === "cotizaciones") throw e; });
    if (["pagos", "comisiones"].includes(s)) await cargar("pagos");
    if ((s === "pagos" || (s === "hoy" && YO.permisos.dinero === "todo")) && (YO.permisos.acciones.includes("agendar") || YO.permisos.dinero === "todo")) await cargar("fuera").catch(() => {});
    if (s === "caballos") await cargar("caballos");
    if (s === "tareas") await cargar("tareas");
    if (s === "salud" || s === "bitacora") await cargar("reportes");
    if (s === "proveedores" || s === "conta") await cargar("conta");
    if (s === "equipo") await cargar("equipo");
    if (s === "reglamento") await cargar("reglamento");
    if (s === "redes") await cargar("redes");
    if (s === "caja") await cargar("caja");
    if (s === "herrajes") await cargar("servicios");
    if (s === "salud") await cargar("servicios").catch(() => {});
    if (s === "compras") await cargar("compras");
    if (s === "estados") await cargar("estados");
    if (s === "cambios") { await cargar("agenda"); await cargar("cotizaciones").catch(() => {}); await cargar("cambios"); }
    if (s === "hoy" && tiene("redes") && YO.permisos.acciones.includes("redes_aprobar")) await cargar("redes").catch(() => {});
    if (s !== ACTUAL) return;
    pintarContador();
    m.innerHTML = ({hoy: vHoy, agenda: vAgenda, clientes: vClientes, eventos: vEventos, pagos: vPagos, caballos: vCaballos, comisiones: vComisiones,

const MESES_ES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

    if (mia && abiertaT(t)) acts.push(`<button class="btn btn-dark" data-terminar="${esc(t.ID)}">Ya la terminé</button>`);

      ${t["Prioridad"] && t["Prioridad"] !== "Normal" ? `<dt>Prioridad</dt><dd>${esc(t["Prioridad"])}</dd>` : ""}
      ${t["Detalle"] ? `<dt>Qué hacer</dt><dd style="white-space:pre-wrap">${esc(t["Detalle"])}</dd>` : ""}
      ${t["Nota de cierre"] ? `<dt>Notas</dt><dd style="white-space:pre-wrap">${esc(t["Nota de cierre"])}</dd>` : ""}
      ${t["Revisó"] ? `<dt>Revisó</dt><dd>${esc(t["Revisó"])}</dd>` : ""}</dl>
    ${acts.length ? `<div class="acts">${acts.join("")}</div>` : ""}</article>`;

function quienAsigno(t) { return t._aprobo ? "Pidió: " + esc(t["Asignó"]) + " · Aprobó: " + esc(t._aprobo.split(" · ")[0]) : "Asignó: " + esc(t["Asignó"]); }
function vTareas() {
  const T = TAREAS.tareas, yo = YO.usuario.nombre, O = YO.org || {}, manda = O.asigna || O.revisaTodo, f = st.tFiltro;
  const filtros = [["pendientes", manda ? "Pendientes" : "Por hacer"]];
  if (O.revisaTodo) filtros.push(["solicitudes", `Solicitudes (${solicitudes().length})`]);
  if (porRevisar().length || manda) filtros.push(["revisar", `Por revisar (${porRevisar().length})`]);
  filtros.push(["disponibles", `Disponibles (${T.filter(t => t._disponible && t["Estatus"] === "Pendiente").length})`]);
  if (manda) filtros.push(["mias", "Mías"]);
  if (O.pide) filtros.push(["pedidas", "Lo que pedí"]);
  filtros.push(["hechas", "Terminadas"]); if (manda) filtros.push(["todas", "Todas"]);
  let L = T;
  if (f === "pendientes") L = T.filter(t => abiertaT(t) && !t._solicitud && (O.revisaTodo || t["Asignada a"] === yo || t._revisar));
  if (f === "solicitudes") L = solicitudes();
  if (f === "revisar") L = porRevisar();
  if (f === "disponibles") L = T.filter(t => t._disponible && t["Estatus"] === "Pendiente");
  if (f === "mias") L = T.filter(t => t["Asignada a"] === yo);
  if (f === "pedidas") L = T.filter(t => t["Asignó"] === yo && (t._solicitud || t._aprobo));
  if (f === "hechas") L = T.filter(t => ["Hecha", "Revisada"].includes(t["Estatus"]));
  L = [...L].sort((a, b) => (lim(a) || "9999") < (lim(b) || "9999") ? -1 : 1);
  const chips = filtros.map(([k, n]) => `<button class="chip" data-tf="${k}" aria-pressed="${f === k}">${n}</button>`).join("");
  const botones = [O.asigna ? `<button class="btn btn-dark" data-nueva-tarea="1">+ Nueva tarea</button>` : "", O.pide ? `<button class="btn${O.asigna ? "" : " btn-dark"}" data-pedir="1">🙋 Pedir tarea</button>` : ""].join("");
  const sub = O.revisaTodo ? "Asigna tareas, aprueba lo que pide el equipo y revisa lo terminado con sus fotos."
    : O.asigna ? "Asigna tareas a tu gente, revisa lo que terminaron y toma trabajo disponible."
    : "Lo que te toca hacer. Cuando termines, márcala como hecha y sube la foto. Si hace falta algo, pídelo con \"Pedir tarea\".";
  return `<h2>Tareas</h2><p class="sub">${sub}</p>${botones ? `<div class="big-actions">${botones}</div>` : ""}
    <div class="bar">${chips}</div>${L.length ? L.map(cardTarea).join("") : `<div class="empty">No hay tareas aquí.</div>`}`;
}

/* ----- Salud de caballos ----- */
const reportesSalud = () => (REPORTES ? REPORTES.reportes : []).filter(r => r["Área"] === "Salud");
function proximosSalud() {
  const ult = {}; // la última próxima fecha por caballo y tipo
  reportesSalud().forEach(r => { if (!r["Próxima fecha"]) return; const k = (r["ID caballo"] || r["Caballo"]) + "|" + r["Tipo"]; if (!ult[k] || ult[k]["Fecha"] <= r["Fecha"]) ult[k] = r; });
  return Object.values(ult).filter(r => r["Próxima fecha"] <= masDias(hoyD(), 30)).sort((a, b) => a["Próxima fecha"] < b["Próxima fecha"] ? -1 : 1);
}
function tablaProximos(L) {
  return `<div class="tbl-wrap"><table><thead><tr><th>Cuándo</th><th>Caballo</th><th>Qué toca</th><th>Último registro</th></tr></thead><tbody>${L.map(r => {
    const venc = r["Próxima fecha"] < hoyD();
    return `<tr><td class="${venc ? "t-vencida" : ""}">${esc(fCorta(r["Próxima fecha"]))}${venc ? " · atrasado" : ""}</td><td>${esc(r["Caballo"])}</td><td>${esc(r["Tipo"])}</td><td>${esc(fCorta(r["Fecha"]))} · ${esc(r["Quién"])}</td></tr>`; }).join("")}</tbody></table></div>`;
}
function cardReporte(r) {

    <p class="card-m">${esc(fDia(r["Fecha"]))} · ${esc(r["Quién"])}${r["Área"] && r["Área"] !== "Salud" ? " · " + esc(r["Área"]) : ""}</p></div>

/* ----- Reglamento (texto en api/_reglamento.js; aceptaciones en la pestaña REGLAMENTO) ----- */
function mdHtml(md) {
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"), L = String(md || "").split("\n"), celdas = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  let h = "", i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("|")) { const rows = []; while (i < L.length && L[i].startsWith("|")) rows.push(L[i++]);
      h += `<div class="tbl-wrap"><table><thead><tr>${celdas(rows[0]).map(c => `<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(2).map(r => `<tr>${celdas(r).map(c => `<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; continue; }
    if (/^- /.test(l)) { let li = ""; while (i < L.length && /^- /.test(L[i])) li += `<li>${inl(L[i++].slice(2))}</li>`; h += `<ul>${li}</ul>`; continue; }
    if (/^\d+\. /.test(l)) { let li = ""; while (i < L.length && /^\d+\. /.test(L[i])) li += `<li>${inl(L[i++].replace(/^\d+\. /, ""))}</li>`; h += `<ol>${li}</ol>`; continue; }
    const m = l.match(/^(#{1,3}) (.*)/); if (m) { const n = m[1].length + 1; h += `<h${n}>${inl(m[2])}</h${n}>`; i++; continue; }
    h += `<p>${inl(l)}</p>`; i++;
  }
  return h;
}

    const t = TAREAS.tareas.find(x => x.ID === b.dataset.avisar); if (!t) return;
    window.open(wa(`Hola ${t["Asignada a"].split(" ")[0]}, tienes una tarea en el portal del rancho: ${t["Tarea"]}${t["Fecha límite"] ? " (para el " + fDia(t["Fecha límite"]) + ")" : ""}. Entra aquí: ${PORTAL}#tareas`), "_blank", "noopener");
  }
  if (b.dataset.nuevoRep !== undefined) {
    const salud = b.dataset.nuevoRep === "Salud", C = (REPORTES && REPORTES.caballos) || [];
    const misTar = misTareas();
    const area0 = salud ? "Salud" : (YO.usuario.area && AREAS.includes(YO.usuario.area) ? YO.usuario.area : (/caball/i.test(YO.usuario.area || "") ? "Caballos" : /jard/i.test(YO.usuario.area || "") ? "Jardinería" : "Caballos"));
    const box = dialogo(salud ? "Registrar salud" : "Nuevo reporte", `<div class="frm">
      ${salud ? "" : `<label>Área</label><select id="d-ar">${opt(AREAS.filter(a => a !== "Salud" || tiene("salud")), area0)}</select>`}
      <label>${salud ? "¿Qué se hizo?" : "Tipo de reporte"}</label><select id="d-ti">${opt(salud ? TIPOS_SALUD : TIPOS_BITACORA, salud ? "Revisión" : "Avance")}</select>
      <label>Caballo ${salud ? "" : "(si aplica)"}</label><input id="d-cab" list="d-cabs" placeholder="Escribe el nombre"><datalist id="d-cabs">${C.map(c => `<option value="${esc(c.Nombre)}">${esc(c.Raza || "")} · ${esc(c.ID)}</option>`).join("")}</datalist>
      <label>Fecha</label><input id="d-f" type="date" value="${hoyD()}" max="${hoyD()}">
      <label>${salud ? "Detalle (medicamento, dosis, hallazgos)" : "¿Qué pasó?"}</label><textarea id="d-de" rows="4" maxlength="2000"></textarea>
      ${salud ? `<label>Próxima fecha (si toca repetir)</label><input id="d-pr" type="date" min="${hoyD()}">` : ""}
      ${misTar.length ? `<label>¿Es de una tarea? (opcional)</label><select id="d-tar"><option value="">No</option>${misTar.map(t => `<option value="${esc(t.ID)}">${esc(t["Tarea"])}</option>`).join("")}</select>` : ""}
      ${campoFotos()}
      <button class="btn btn-dark" id="d-ok">Guardar</button></div>`);
    activarFotos(box);
    box.querySelector("#d-ok").onclick = () => {
      const nom = box.querySelector("#d-cab").value.trim(), c = C.find(x => x.Nombre.toLowerCase() === nom.toLowerCase());
      if (salud && !nom) return alert("Escribe el caballo.");
      const reporte = {area: salud ? "Salud" : box.querySelector("#d-ar").value, tipo: box.querySelector("#d-ti").value, caballo: c ? c.Nombre : nom, idCaballo: c ? c.ID : "",
        fecha: box.querySelector("#d-f").value, descripcion: box.querySelector("#d-de").value.trim(), proxima: salud ? box.querySelector("#d-pr").value : "", tarea: box.querySelector("#d-tar") ? box.querySelector("#d-tar").value : ""};
      enviar(box, {tipo: "reporte", reporte}, salud ? "Registro de salud guardado" : "Reporte enviado");
    };
  }
  if (b.dataset.registro) {
    const clase = b.dataset.registro, C = CONTA || {compras: [], ventas: [], maquilas: [], pensiones: []};
    const refs = clase === "pago" ? C.compras.filter(c => numv(c.Saldo) > 0).map(c => [c.Folio, `${c.Folio} · ${c.Proveedor} · ${c.Caballo} · debe ${c.Saldo}`])
      : [...C.ventas.filter(v => numv(v.Saldo) > 0).map(v => [v.Folio, `${v.Folio} · ${v.Comprador} · ${v.Concepto} · saldo ${v.Saldo}`]), ...C.maquilas.filter(v => numv(v.Saldo) > 0).map(v => [v.Folio, `${v.Folio} · Maquila ${v.Cliente} · saldo ${v.Saldo}`]), ...C.pensiones.filter(v => numv(v.Saldo) > 0).map(v => [v.Folio, `${v.Folio} · Pensión ${v.Cliente} · ${v.Caballo} · saldo ${v.Saldo}`])];
    const titulo = {pago: "Pago a proveedor", cobro: "Registrar cobro", gasto: "Registrar gasto"}[clase];
    const box = dialogo(titulo, `<div class="frm">
      ${clase === "gasto" ? `<div class="dos"><div><label>Categoría</label><select id="r-cat">${opt(CATS_GASTO, "Alimento")}</select></div><div><label>Proveedor</label><input id="r-prov" maxlength="60"></div></div>
        <label>Concepto</label><input id="r-con" maxlength="120" placeholder="Ej. Galope Alto Rendimiento 100 bultos">
        <div class="dos"><div><label>Cantidad (opcional)</label><input id="r-cant" inputmode="decimal"></div><div><label>Total pagado (MXN)</label><input id="r-monto" inputmode="decimal"></div></div>`
      : `<label>${clase === "pago" ? "¿A qué compra se abona?" : "¿De qué venta, maquila o pensión?"}</label><select id="r-ref"><option value="">Elige</option>${refs.map(([k, t]) => `<option value="${esc(k)}"${k === b.dataset.ref ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>
        <div class="dos"><div><label>Monto</label><input id="r-monto" inputmode="decimal"></div><div><label>Moneda</label><select id="r-mon">${opt(["MXN", "USD", "EUR"], "MXN")}</select></div></div>
        <label>Tipo de cambio (solo si no es MXN)</label><input id="r-tc" inputmode="decimal">`}
      <div class="dos"><div><label>Fecha</label><input id="r-f" type="date" value="${hoyD()}"></div><div><label>Forma de pago</label><select id="r-forma">${opt(["Transferencia", "Efectivo", "Tarjeta", "Cheque", "Depósito", "Otro"], "Transferencia")}</select></div></div>
      ${clase !== "gasto" ? `<label>Cuenta (opcional)</label><input id="r-cta" maxlength="60" placeholder="Ej. BBVA rancho">` : ""}
      ${clase === "cobro" ? `<label>¿Ya se facturó?</label><select id="r-fac">${opt(["No", "Sí"], "No")}</select>` : ""}
      <label>Notas (opcional)</label><input id="r-not" maxlength="300">
      ${campoFotos("Subir comprobante (foto o PDF)", true)}
      <button class="btn btn-dark" id="d-ok">Guardar</button></div>`);
    activarFotos(box);
    const v = id => (box.querySelector(id) || {}).value || "";
    box.querySelector("#d-ok").onclick = () => {
      const registro = {clase, referencia: v("#r-ref"), monto: v("#r-monto"), moneda: v("#r-mon") || "MXN", tc: v("#r-tc"), fecha: v("#r-f"), forma: v("#r-forma"), cuenta: v("#r-cta"),
        facturado: v("#r-fac"), notas: v("#r-not"), categoria: v("#r-cat"), proveedor: v("#r-prov"), concepto: v("#r-con"), cantidad: v("#r-cant")};
      if (clase !== "gasto" && !registro.referencia) return alert("Elige la referencia.");
      if (!(numv(registro.monto) > 0)) return alert("Escribe el monto.");
      enviar(box, {tipo: "registro", registro}, "Guardado en la Maestra");
    };
  }
  if (b.dataset.factura) {
    const box = dialogo("Marcar facturado", `<div class="frm"><p>Cobro ${esc(b.dataset.ref)}</p><label>Folio o nota de la factura (opcional)</label><input id="r-not" maxlength="200">${campoFotos("Subir la factura (PDF o foto)", true)}<button class="btn btn-dark" id="d-ok">Marcar facturado</button></div>`);
    activarFotos(box);
    box.querySelector("#d-ok").onclick = () => enviar(box, {tipo: "registro", registro: {clase: "factura", fila: b.dataset.factura, referencia: b.dataset.ref, notas: box.querySelector("#r-not").value}}, "Cobro marcado como facturado");
  }
  if (b.dataset.celular) {
    if (!confirm(`¿Generar la liga de celular de ${b.dataset.nom}? Si ya tenía una, la anterior deja de servir.`)) return;
    b.disabled = true;
    try { const j = await post({accion: "hacer", tipo: "liga_celular", id: b.dataset.celular});
      const msg = `Hola ${b.dataset.nom.split(" ")[0]}, esta es tu entrada al portal del Rancho El Descanso. Ábrela en tu celular y después agrégala a tu pantalla de inicio: ${j.url}`;
      dialogo("Liga de celular · " + b.dataset.nom, `<div class="frm"><p>Mándasela solo a ${esc(b.dataset.nom)}. Sirve un año en su celular; si lo pierde, genera otra y esta deja de servir.</p>
        <input readonly value="${esc(j.url)}" onclick="this.select()"><a class="btn btn-wa" href="${wa(msg)}" target="_blank" rel="noopener">Mandar por WhatsApp</a></div>`);
      EQUIPO = null; }
    catch (err) { alert(err.message); } b.disabled = false;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "s-caballo") { st.sCaballo = e.target.value; render(); }
  if (e.target.id === "c-mes") { st.mes = e.target.value; render(); }
});

/* formulario de tarea: nueva (asignar), pedir (le llega a Mario y Nico) o aprobar una solicitud */
function formTarea(modo, t) {
  const O = YO.org || {}, per = (TAREAS && TAREAS.personas) || [], areas = O.areas && O.areas.length && modo === "nueva" ? O.areas : AREAS;
  const area0 = t ? t["Área"] : areas.includes(O.area) ? O.area : areas[0];
  const opcPer = per.map(x => `<option value="${esc(x.nombre)}">${esc(x.nombre)}${x.area ? " · " + esc(x.area) : ""}</option>`).join("");
  const destino = `<label>¿Para quién?</label><select id="d-a"><option value="">Elige a una persona</option>${opcPer}${per.length > 1 ? `<option value="__disp">Disponible: que la tome alguien que yo elija</option>` : ""}</select>
    <div id="d-disp" hidden><label>¿Quién puede tomarla? El primero que la tome se la queda.</label><div class="chkgrid">
      ${(YO.org && O.revisaTodo) || (TAREAS && TAREAS.personas.length >= ((TAREAS.todos || []).length)) ? `<label class="chk"><input type="checkbox" id="d-todos"> Todos</label>` : ""}
      ${per.map(x => `<label class="chk"><input type="checkbox" data-dp="${esc(x.corto)}"> ${esc(x.corto)}</label>`).join("")}</div></div>`;
  const foto = `<label class="chk"><input type="checkbox" id="d-foto"${t && t._foto ? " checked" : ""}> 📷 Pide foto al terminar (no se puede marcar como hecha sin foto)</label>`;
  if (modo === "aprobar") return `<div class="frm"><div class="ctx"><b>${esc(t["Tarea"])}</b><br>Pidió: ${esc(t["Asignó"])}${/Por definir$/.test(t["Asignada a"]) ? "" : " · Sugiere: " + esc(t["Asignada a"].replace(/^Solicitud · /, ""))}${t["Área"] ? " · " + esc(t["Área"]) : ""}</div>
    ${destino}<label>Detalles</label><textarea id="d-d" rows="3" maxlength="1500">${esc(t["Detalle"] || "")}</textarea>
    <div class="dos"><div><label>Para cuándo</label><input id="d-l" type="date" value="${esc(lim(t))}"></div><div><label>Prioridad</label><select id="d-p">${opt(["Normal", "Alta", "Baja"], t["Prioridad"] || "Normal")}</select></div></div>
    ${foto}<button class="btn btn-dark" id="d-ok">Aprobar y asignar</button></div>`;
  const pedir = modo === "pedir", todos = (TAREAS && TAREAS.todos) || [];
  return `<div class="frm">${pedir ? `<p class="sub" style="margin:0 0 12px">Le llega a Mario (y a Nico) para que la aprueben y la asignen.</p>` : ""}
    <label>¿Qué hay que hacer?</label><input id="d-t" maxlength="140" placeholder="Ej. Podar los árboles de la entrada">
    <label>Detalles (opcional)</label><textarea id="d-d" rows="3" maxlength="1500" placeholder="${pedir ? "Para qué es y cualquier cosa que ayude" : "Explica cómo o qué materiales usar"}"></textarea>
    ${pedir ? `<label>¿Quién crees que debería hacerla? (opcional)</label><select id="d-a"><option value="">Que lo decida Mario</option>${todos.filter(n => n !== YO.usuario.nombre).map(n => `<option>${esc(n)}</option>`).join("")}</select>` : destino}
    <div class="dos"><div><label>Área</label><select id="d-ar">${opt(areas, area0)}</select></div><div><label>Para cuándo</label><input id="d-l" type="date" min="${hoyD()}"></div></div>
    <label>Prioridad</label><select id="d-p">${opt(["Normal", "Alta", "Baja"], "Normal")}</select>
    ${pedir ? "" : foto}
    ${campoFotos("Agregar foto de referencia (opcional)")}
    <button class="btn btn-dark" id="d-ok">${pedir ? "Mandar solicitud" : "Asignar tarea"}</button></div>`;
}

/* ---------- acciones ---------- */
function dialogo(titulo, html) { $("#dlg-t").textContent = titulo; $("#dlg-b").innerHTML = html; if (!$("#dlg").open) $("#dlg").showModal(); return $("#dlg-b"); }
$("#dlg-x").addEventListener("click", () => $("#dlg").close());
$("#dlg").addEventListener("close", () => { $("#dlg-b").innerHTML = ""; });
async function hacer(body, ok) { try { await post({accion: "hacer", ...body}); toast(ok); AGENDA = null; render(); } catch (e) { alert(e.message); } }
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.fa) { st.agendaFiltro = b.dataset.fa; render(); }
  if (b.dataset.ine) {
    const box = dialogo("Identificación del titular", `<p class="load">Cargando…</p>`);
    try { const j = await api("accion=ine&evento=" + encodeURIComponent(b.dataset.ine));
      const bytes = Uint8Array.from(atob(j.datos), c => c.charCodeAt(0)), url = URL.createObjectURL(new Blob([bytes], {type: j.tipo}));
      box.innerHTML = /pdf/.test(j.tipo) ? `<iframe src="${url}" title="Identificación"></iframe><p><a class="btn" href="${url}" target="_blank" rel="noopener">Abrir en otra pestaña</a></p>` : `<img src="${url}" alt="Identificación del titular">`; }
    catch (err) { box.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
  }
  if (b.dataset.liga) {
    b.disabled = true;
    try { const j = await post({accion: "hacer", tipo: "liga", folio: b.dataset.liga}); if (!j.liga) throw new Error("No se pudo generar la liga.");
      const msg = `Hola${b.dataset.nom ? " " + b.dataset.nom : ""}, te escribimos de Rancho El Descanso. Tu sesión de fotos es el ${fDia(b.dataset.fecha)}. Queda pendiente el resto (${money(b.dataset.resta)} MXN). Puedes pagarlo aquí: ${j.liga} . Cualquier duda, por aquí te ayudamos.`;
      window.open("https://wa.me/" + b.dataset.tel + "?text=" + encodeURIComponent(msg), "_blank", "noopener"); }
    catch (err) { alert(err.message); } b.disabled = false;
  }
  if (b.dataset.pagado) {
    const box = dialogo("Marcar resto pagado", `<p style="text-align:left">¿Cómo pagó el cliente el resto?</p><input id="d-como" value="Transferencia" maxlength="80"><button class="btn btn-dark" id="d-ok">Marcar pagado</button>`);
    box.querySelector("#d-ok").onclick = () => { const como = box.querySelector("#d-como").value; $("#dlg").close(); hacer({tipo: "saldo_pagado", evento: b.dataset.pagado, fecha: b.dataset.fecha, como}, "Resto marcado como pagado"); };
  }
  if (b.dataset.confirmar && confirm("¿Confirmar este evento? La cita cambia a \"Confirmado\".")) hacer({tipo: "confirmar_evento", evento: b.dataset.confirmar}, "Evento confirmado");
  if (b.dataset.nota) {
    const box = dialogo("Agregar nota a la cita", `<textarea id="d-nota" rows="4" maxlength="300" placeholder="Ej. Llegan 30 min tarde · Traen 2 caballos propios"></textarea><button class="btn btn-dark" id="d-ok">Guardar nota</button>`);
    box.querySelector("#d-ok").onclick = () => { const nota = box.querySelector("#d-nota").value.trim(); if (!nota) return; $("#dlg").close(); hacer({tipo: "nota", evento: b.dataset.nota, nota}, "Nota guardada"); };
  }
  if (b.dataset.bloquear) {
    const box = dialogo("Bloquear un día", `<input id="d-fecha" type="date" min="${hoyISO()}"><input id="d-motivo" maxlength="80" placeholder="Motivo (ej. Mantenimiento, evento privado)"><button class="btn btn-dark" id="d-ok">Bloquear día</button>`);
    box.querySelector("#d-ok").onclick = () => { const fecha = box.querySelector("#d-fecha").value, motivo = box.querySelector("#d-motivo").value.trim() || "Bloqueado";
      if (!fecha) return; $("#dlg").close(); hacer({tipo: "bloquear", fecha, motivo}, "Día bloqueado: ya no se puede reservar en la página"); };
  }
});
document.addEventListener("input", e => { if (e.target.id === "busca") { st.busca = e.target.value; const pos = e.target.selectionStart; render().then(() => { const i = $("#busca"); if (i) { i.focus(); i.setSelectionRange(pos, pos); } }); } });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1) || "hoy"; if (YO && h !== ACTUAL && (YO.permisos.secciones.includes(h) || h === "menu")) ir(h); });
iniciar();
</script>
</body>
