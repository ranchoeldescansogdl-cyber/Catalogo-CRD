<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Elige tu nueva fecha · Rancho El Descanso</title>
<link rel="icon" href="/marca/simbolo-oro.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* 3 oct 2026 · el cliente elige su nueva fecha cuando el equipo reagenda su sesión o evento (api/reagendar.js) */
:root{--black:#000;--ink:#0A0A0A;--paper:#fff;--mist:#F4F3F0;--muted:#5E5B55;--rule:rgba(0,0,0,.12);--gold:#CEB35C;--gold-deep:#A3853C;
  --ok:#1f7a3d;--ok-bg:#e6f3ea;--bad:#b3261e;--bad-bg:#fbe6e4;--display:'Marcellus',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{background:var(--black);padding:calc(18px + env(safe-area-inset-top,0px)) 16px 18px;text-align:center}
header img{width:min(260px,70vw);height:auto;display:inline-block}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:var(--display);font-weight:400;font-size:1.65rem;margin:4px 0 6px;line-height:1.2}
h2{font-family:var(--display);font-weight:400;font-size:1.2rem;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:16px;margin:0 0 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.95rem}.kv dt{color:var(--muted)}.kv dd{margin:0}
.favor{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:.93rem;margin:12px 0 0}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.cal-h b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.nav{border:1px solid var(--rule);background:#fff;border-radius:999px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
.nav[disabled]{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:.75rem;color:var(--muted);text-align:center;padding:2px 0}
.d{aspect-ratio:1;border:1px solid transparent;border-radius:10px;background:none;font:inherit;font-size:.95rem;cursor:pointer;color:var(--ink);padding:0}
.d.ok{background:#fff;border-color:var(--rule)}
.d.ok:hover{border-color:var(--gold)}
.d.no{color:#b9b6ae;cursor:default}
.d.fest{color:#b9b6ae;cursor:default;text-decoration:line-through}
.d.sel{background:var(--black);color:var(--gold);border-color:var(--black)}
.leyenda{font-size:.82rem;color:var(--muted);margin:10px 0 0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer}
.opt[aria-pressed=true]{background:var(--black);color:var(--gold);border-color:var(--black)}
.btn{display:block;width:100%;border:0;border-radius:999px;background:var(--black);color:var(--gold);font:inherit;font-weight:600;font-size:1.05rem;padding:15px;cursor:pointer;margin:18px 0 0;text-align:center;text-decoration:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn-wa{background:#25D366;color:#fff}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:12px;margin:14px 0 0}
.load{color:var(--muted);text-align:center;padding:40px 0}
.ok-ico{font-size:2.6rem;text-align:center;margin:8px 0 0;color:var(--gold-deep)}
footer{color:var(--muted);font-size:.85rem;text-align:center;padding:0 16px 32px}
footer a{color:inherit}
</style>
</head>
<body>
<header><a href="/"><img src="/marca/logo-horizontal-oro-blanco.png" alt="Rancho El Descanso"></a></header>
<main id="main"><p class="load">Cargando tu reserva…</p></main>
<footer>Rancho El Descanso · San Miguel Cuyutlán, Tlajomulco · <a href="https://wa.me/523316045548" target="_blank" rel="noopener">WhatsApp +52 33 1604 5548</a></footer>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const WA = "https://wa.me/523316045548";
const T = new URLSearchParams(location.search).get("t") || "";
const fDia = iso => { const t = new Date(iso + "T12:00:00Z").toLocaleDateString("es-MX", {weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC"}); return t.charAt(0).toUpperCase() + t.slice(1); };
const hoyISO = () => new Intl.DateTimeFormat("en-CA", {timeZone: "America/Mexico_City"}).format(new Date());
const iso = (y, m, d) => `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
const HOR_TXT = {"10-14": "Mañana · 10:00 a 14:00", "14-18": "Tarde · 14:00 a 18:00"};
let D = null;
const st = {mes: null, fecha: "", horario: "", llegada: ""};

function waTxt(t) { return WA + "?text=" + encodeURIComponent(t); }
function fallo(msg) {
  $("#main").innerHTML = `<h1>No pudimos abrir tu reserva</h1><p class="sub">${esc(msg)}</p>
    <a class="btn btn-wa" href="${waTxt("Hola, quiero elegir la nueva fecha de mi reserva en Rancho El Descanso.")}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>`;
}
async function iniciar() {
  if (!/^[a-f0-9]{40}$/.test(T)) return fallo("Esta liga no está completa. Ábrela otra vez desde tu correo o tu WhatsApp, o escríbenos.");
  try {
    const r = await fetch("/api/reagendar?t=" + encodeURIComponent(T), {cache: "no-store"}); D = await r.json().catch(() => ({}));
    if (!r.ok) return fallo(D.error || "Intenta en unos minutos.");
  } catch (e) { return fallo("Revisa tu conexión e intenta otra vez."); }
  history.replaceState(null, "", location.pathname + "?t=" + T);
  if (!D.pendiente) return listo(D.nueva, true);
  const h = hoyISO(); st.mes = h.slice(0, 7);
  pintar();
}
const que = () => D.tipo === "sesion" ? "tu sesión de fotos" : "tu " + String(D.evento || "evento").toLowerCase();
/* ¿Qué horarios quedan libres ese día? (sesiones) */
function horariosLibres(f) {
  const dow = new Date(f + "T12:00:00Z").getUTCDay(), x = (D.dias || {})[f] || {d: null, s: []};
  if (x.d) return [];
  return (D.semana[dow] || []).filter(h => !(x.s || []).includes(h) && (new Date(`${f}T${h.slice(0, 2)}:00:00-06:00`) - Date.now()) / 36e5 >= D.reglas.minHoras);
}
function diaOk(f) {
  if (f <= hoyISO() || f > D.hasta || (D.festivos || {})[f]) return false;
  if (D.tipo === "sesion") return horariosLibres(f).length > 0;
  const x = (D.dias || {})[f] || {}; return !x.d && !x.x;
}
function calendario() {
  const [y, m] = st.mes.split("-").map(Number), primero = new Date(Date.UTC(y, m - 1, 1)), dias = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const nombre = primero.toLocaleDateString("es-MX", {month: "long", year: "numeric", timeZone: "UTC"}).replace(/^./, c => c.toUpperCase());
  const min = hoyISO().slice(0, 7), max = D.hasta.slice(0, 7);
  let celdas = ["Do", "Lu", "Ma", "Mi", "Ju", "Vi", "Sá"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = 0; i < primero.getUTCDay(); i++) celdas += "<div></div>";
  for (let d = 1; d <= dias; d++) {
    const f = iso(y, m - 1, d), fest = (D.festivos || {})[f], ok = diaOk(f);
    celdas += `<button type="button" class="d ${f === st.fecha ? "sel" : fest && f > hoyISO() ? "fest" : ok ? "ok" : "no"}" ${ok ? `data-f="${f}"` : "disabled"} aria-label="${esc(fDia(f))}${ok ? " disponible" : " no disponible"}${fest ? " · día festivo" : ""}">${d}</button>`;
  }
  return `<div class="card"><div class="cal-h"><button class="nav" type="button" data-mes="-1" ${st.mes <= min ? "disabled" : ""} aria-label="Mes anterior">‹</button><b>${esc(nombre)}</b>
    <button class="nav" type="button" data-mes="1" ${st.mes >= max ? "disabled" : ""} aria-label="Mes siguiente">›</button></div><div class="grid">${celdas}</div>
    <p class="leyenda">Los días en blanco están disponibles. Días festivos (tachados): pregúntanos por WhatsApp.</p></div>`;
}
function pintar() {
  const hor = st.fecha && D.tipo === "sesion" ? horariosLibres(st.fecha) : [];
  if (st.horario && !hor.includes(st.horario)) { st.horario = ""; st.llegada = ""; }
  const llegadas = st.horario ? D.reglas.llegadas[st.horario] || [] : [];
  const listoP = st.fecha && (D.tipo !== "sesion" || (st.horario && st.llegada));
  const rancho = D.motivo === "reagendar_rancho";
  $("#main").innerHTML = `<h1>Hola${D.nombre ? " " + esc(D.nombre) : ""}, elige tu nueva fecha</h1>
    <p class="sub">${rancho ? "Por un motivo del rancho necesitamos mover " + esc(que()) + ". Te ofrecemos una disculpa." : "Aquí eliges la nueva fecha de " + esc(que()) + "."}</p>
    <div class="card"><dl class="kv"><dt>Reserva</dt><dd>${D.tipo === "sesion" ? "Sesión de fotos" + (D.paqueteTxt ? " · " + esc(D.paqueteTxt) : "") : esc(D.evento || "Evento")}</dd>
      ${D.original ? `<dt>Fecha anterior</dt><dd>${esc(fDia(D.original))}</dd>` : ""}</dl>
      ${D.conPago ? `<p class="favor">Lo que ya pagaste queda a tu favor para la nueva fecha. No tienes que pagar nada aquí.</p>` : ""}</div>
    <h2>1. Elige el día</h2>${calendario()}
    ${D.tipo === "sesion" && st.fecha ? `<h2>2. Horario · ${esc(fDia(st.fecha))}</h2><div class="opts">${hor.map(h => `<button type="button" class="opt" data-h="${h}" aria-pressed="${h === st.horario}">${HOR_TXT[h] || h}</button>`).join("")}</div>` : ""}
    ${st.horario ? `<h2>3. ¿A qué hora llegan?</h2><p class="sub">Tu sesión dura ${D.reglas.sesionHoras} horas desde que llegan.</p><div class="opts">${llegadas.map(l => `<button type="button" class="opt" data-l="${l}" aria-pressed="${l === st.llegada}">${l} h</button>`).join("")}</div>` : ""}
    <button class="btn" type="button" id="ok" ${listoP ? "" : "disabled"}>${listoP ? "Confirmar " + esc(fDia(st.fecha)) + (st.llegada ? " · " + st.llegada + " h" : "") : "Elige " + (st.fecha ? "horario y llegada" : "el día")}</button>
    <div id="msg" role="status"></div>
    <a class="btn btn-wa" href="${waTxt("Hola, tengo una duda sobre la nueva fecha de mi reserva en Rancho El Descanso.")}" target="_blank" rel="noopener">¿Dudas? Escríbenos por WhatsApp</a>`;
}
function listo(nueva, ya) {
  $("#main").innerHTML = `<p class="ok-ico" aria-hidden="true">✓</p><h1 style="text-align:center">${ya ? "Tu nueva fecha ya quedó" : "¡Listo, quedó tu nueva fecha!"}</h1>
    <div class="card"><p style="margin:0;text-align:center;font-size:1.1rem">${esc(nueva || "")}</p></div>
    <p class="sub" style="text-align:center">${ya ? "Esta liga ya se usó. Si necesitas otro cambio, escríbenos." : "Te mandamos la confirmación por correo. Si necesitas otro cambio, escríbenos."}</p>
    <a class="btn btn-wa" href="${waTxt("Hola, ya elegí mi nueva fecha en Rancho El Descanso: " + (nueva || ""))}" target="_blank" rel="noopener">WhatsApp del rancho</a>
    <a class="btn" href="/">Ir a la página del rancho</a>`;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b || !D) return;
  if (b.dataset.mes) { const [y, m] = st.mes.split("-").map(Number), d = new Date(Date.UTC(y, m - 1 + Number(b.dataset.mes), 1)); st.mes = d.toISOString().slice(0, 7); pintar(); }
  if (b.dataset.f) { st.fecha = b.dataset.f; st.horario = st.llegada = ""; const h = D.tipo === "sesion" ? horariosLibres(st.fecha) : []; if (h.length === 1) st.horario = h[0]; pintar(); }
  if (b.dataset.h) { st.horario = b.dataset.h; st.llegada = ""; pintar(); }
  if (b.dataset.l) { st.llegada = b.dataset.l; pintar(); }
  if (b.id === "ok") {
    b.disabled = true; b.textContent = "Guardando…";
    try {
      const r = await fetch("/api/reagendar", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({t: T, fecha: st.fecha, horario: st.horario, llegada: st.llegada})});
      const j = await r.json().catch(() => ({}));
      if (r.ok) return listo(j.nueva);
      if (j.usado) return listo(String(j.error || "").replace(/^.*es el /, "").replace(/\.$/, ""), true);
      $("#msg").innerHTML = `<div class="err">${esc(j.error || "No se pudo guardar. Intenta otra vez.")}</div>`;
      if (r.status === 409) { const g = await fetch("/api/reagendar?t=" + encodeURIComponent(T), {cache: "no-store"}); if (g.ok) { D = await g.json(); st.fecha = st.horario = st.llegada = ""; const m = $("#msg").innerHTML; pintar(); $("#msg").innerHTML = m; } }
      else { b.disabled = false; b.textContent = "Intentar de nuevo"; }
    } catch (err) { $("#msg").innerHTML = `<div class="err">Revisa tu conexión e intenta otra vez.</div>`; b.disabled = false; b.textContent = "Intentar de nuevo"; }
  }
});
iniciar();
</script>
</body>
</html>
